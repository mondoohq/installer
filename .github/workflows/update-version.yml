name: Update Release Version

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version that should be released'
        required: true
        default: '1.2.3'
      dry-run:
        description: 'Skip PR create/approve/merge/slack (test base-branch decision only)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    env:
      # C07R9GSGKEU == #mondoo-ops
      SLACK_BOT_CHANNEL_ID: "C07R9GSGKEU"
    steps:
      - name: Version from Workflow Dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "VERSION=${INPUT_VERSION#v}" >> "$GITHUB_ENV"
      - name: Version from Release Tag
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - name: Verify valid version
        id: vars
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # Sparse-checkout the scripts dir before we know the target branch, so
      # we can run determine-version-bump-base.sh to figure out where to open
      # the bump PR. Pinned to main because on the release event github.ref
      # is the release tag (e.g. refs/tags/v13.35.1 for a v13 patch), and
      # the v13 branch's tag may predate this script's existence. The full
      # checkout of the resolved base branch happens below.
      # It goes in its own directory: dropping it in the workspace root left
      # the second checkout reusing this repo, and a sparse working tree keeps
      # its patterns across that checkout, so VERSION stayed outside the
      # sparse definition and `git add -- VERSION` was silently skipped.
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: '.github/scripts'
          sparse-checkout-cone-mode: false
          path: .bump-scripts
      # Route the VERSION bump to the right branch by comparing the incoming
      # release's major with the major currently on main (read from main's
      # VERSION file). Matching major -> base=main; any other major -> base=
      # v{major} support branch (e.g. a v13.35.1 release while main tracks
      # v14 -> base=v13). Prevents a v13 patch from clobbering main's VERSION.
      # Logic lives in .github/scripts/determine-version-bump-base.sh and is
      # unit-tested via .github/scripts/tests/determine-version-bump-base.bats.
      - name: Determine base branch
        id: base
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(.bump-scripts/.github/scripts/determine-version-bump-base.sh "$VERSION")
          echo "Release: ${VERSION}, resolved base branch: ${BASE}"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.base }}
          fetch-depth: 0
      - name: Prepare title
        id: title
        run: |
          echo "COMMIT_TITLE=Update VERSION to ${VERSION}" >> "$GITHUB_OUTPUT"
          echo "BRANCH_NAME=automation/update-version-${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Write VERSION file
        run: |
          echo "${VERSION}" > VERSION
          echo "VERSION is ${VERSION}"
      # Dry-run stops here after the routing/decision + local file write, so
      # a workflow_dispatch with dry-run=true exercises the routing end to
      # end without opening or approving a real PR.
      - name: Dry run summary
        if: ${{ inputs.dry-run }}
        run: |
          echo "::notice::DRY RUN — no PR opened."
          echo "  version: ${VERSION}"
          echo "  base:    ${{ steps.base.outputs.base }}"
          echo "  branch:  ${{ steps.title.outputs.BRANCH_NAME }}"
          echo "  title:   ${{ steps.title.outputs.COMMIT_TITLE }}"
          echo
          echo "Would have written this VERSION file:"
          cat VERSION
      - name: 🔑 Generate GitHub App Token (mondoohq)
        if: ${{ !inputs.dry-run }}
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id accepts the same value as the old app-id input, see
          # https://github.com/actions/create-github-app-token/blob/v3.1.1/main.js#L21
          client-id: ${{ secrets.MONDOO_MERGEBOT_APP_ID }}
          private-key: ${{ secrets.MONDOO_MERGEBOT_APP_PRIVATE_KEY }}
      - name: Create PR
        if: ${{ !inputs.dry-run }}
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ steps.base.outputs.base }}
          # main requires signed commits; without this the PR is created but
          # merges as BLOCKED. Note that sign-commits makes the action ignore
          # the committer/author inputs and attribute commits to the identity
          # of the token used here (github-actions[bot]).
          sign-commits: true
          commit-message: ${{ steps.title.outputs.COMMIT_TITLE }}
          title: ${{ steps.title.outputs.COMMIT_TITLE }}
          branch: ${{ steps.title.outputs.BRANCH_NAME }}
          delete-branch: true
          add-paths: |
            VERSION
          body: |
            Bumps the `VERSION` file to `${{ steps.vars.outputs.version }}` following the
            release of `v${{ steps.vars.outputs.version }}`.

            Opened automatically by the
            [Update Release Version workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
      - name: Add Audit Trail Comment
        if: ${{ !inputs.dry-run && steps.create-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr comment "${PR_NUMBER}" \
            --body "### 🤖 Automated System Action: Release Version Sync
          This pull request was generated automatically by the Update Release Version workflow after release \`v${VERSION}\` was published.

          It updates only the \`VERSION\` file so the repository matches the published release. It contains no human-authored application code, so it is approved and merged by the automation service account to keep the repository in sync with the release.
          * **Audit Category:** Release Metadata Sync
          * **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Approve Pull Request
        if: ${{ !inputs.dry-run && steps.create-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          # The PR is authored by github-actions[bot]; mondoo-mergebot is a
          # separate identity, so this approval satisfies the requirement that
          # every PR is reviewed and approved by someone other than the author.
          echo "Approving PR #${PR_NUMBER}"
          gh pr review "${PR_NUMBER}" --approve
      - name: Merge Pull Request
        if: ${{ !inputs.dry-run && steps.create-pr.outputs.pull-request-number }}
        # Bounded so a required check that never reports fails the job (and
        # fires the Slack alert below) rather than hanging until the job limit.
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          # The merge is attempted seconds after the PR is opened, long before
          # required checks finish, so wait for them first. --watch keeps this
          # synchronous: unlike `gh pr merge --auto`, a failed check or refused
          # merge fails the job instead of silently leaving the PR open.
          #
          # --watch only watches the checks that exist when it starts, and a
          # second after the PR is opened none are registered yet -- gh treats
          # that as a failure ("no checks reported on the ... branch", exit 1)
          # rather than waiting.
          #
          # Nor is it enough to wait for the first check and hand off, because
          # they register in waves. On PR #760: GitGuardian registered AND
          # completed within one second, the next seven arrived 43 seconds
          # later, and the last 2m36s after that. --watch would have seen one
          # finished check and returned -- and main has no required status
          # checks, so the merge below would have succeeded. Green, with most
          # checks not yet in existence.
          #
          # A count that stops changing is not proof either: between the first
          # check and the second there is a 43 second window in which the count
          # is stable at 1. So settling needs both a stable count and enough
          # elapsed time to have covered the gaps -- hence the floor, which is
          # roughly twice the 2m36s spread actually observed.
          #
          # If these checks were required on main, none of this would be
          # needed: `gh pr merge` would refuse until they passed. That is the
          # better fix and this is the one available from inside the workflow.
          # Both are tuned to what this repository's suite actually did on
          # PR #760 -- a 2m36s spread between the first check registering and
          # the last. They will need revisiting if that spread grows: the cost
          # of being wrong low is a merge that skipped its checks, the cost of
          # being wrong high is a slower release, so prefer generous.
          SETTLE_FLOOR_SECONDS=300
          QUIET_SECONDS=60
          # Under the step's timeout-minutes, so the loop reports its own
          # failure rather than being killed mid-wait.
          SETTLE_DEADLINE_SECONDS=900
          STARTED_AT=$(date +%s)

          # Phase 1: something to watch. Its own budget, so a slow first
          # registration cannot eat the settle phase's retries.
          registered=0
          for _ in $(seq 1 18); do
            # Defaulted twice on purpose: `|| echo 0` covers gh exiting
            # non-zero, ${x:-0} covers it exiting zero with no output. Without
            # the second, an empty value makes every later [ ] comparison
            # error, and an erroring comparison reads as false -- so the guards
            # here would silently not fire.
            registered=$(gh pr view "${PR_NUMBER}" --json statusCheckRollup \
              --jq '.statusCheckRollup | length' 2>/dev/null || echo 0)
            registered=${registered:-0}
            [ "${registered}" -gt 0 ] && break
            sleep 10
          done
          if [ "${registered}" -eq 0 ]; then
            echo "::error::no checks registered on PR #${PR_NUMBER} after 3 minutes"
            exit 1
          fi

          # Phase 2: watch what is there, look again, and repeat until the set
          # has stopped growing and enough time has passed for a late arrival
          # to have shown up.
          # Two conditions, because neither alone is enough. QUIET_SECONDS is
          # measured from the last time the count actually changed, so it is a
          # real quiet period rather than "unchanged across one poll"; the
          # floor then guarantees a minimum total wait regardless of when the
          # changes happened to fall.
          #
          # Bounded by elapsed time rather than an iteration count: each pass
          # blocks inside --watch for however long the slowest check takes, so
          # counting iterations would give up after an amount of time nobody
          # can predict from reading it.
          settled=0
          previous=-1
          last_change_at=${STARTED_AT}
          while [ "$(( $(date +%s) - STARTED_AT ))" -lt "${SETTLE_DEADLINE_SECONDS}" ]; do
            count=$(gh pr view "${PR_NUMBER}" --json statusCheckRollup \
              --jq '.statusCheckRollup | length' 2>/dev/null || echo 0)
            count=${count:-0}
            now=$(date +%s)
            elapsed=$(( now - STARTED_AT ))

            if [ "${count}" -ne "${previous}" ]; then
              last_change_at=${now}
              previous="${count}"
            fi

            # The count is part of the condition, not just its stability: a
            # persistent 0 -- a flapping API, or the defaults above firing
            # repeatedly -- is stable too, and without this the loop would
            # settle on having watched nothing. The final watch below catches
            # that today, but relying on a later step to reject a state this
            # one declared good is the wrong place for the check.
            if [ "${count}" -gt 0 ] \
              && [ "$(( now - last_change_at ))" -ge "${QUIET_SECONDS}" ] \
              && [ "${elapsed}" -ge "${SETTLE_FLOOR_SECONDS}" ]; then
              settled=1
              break
            fi

            if [ "${count}" -gt 0 ]; then
              echo "Watching ${count} check(s) on PR #${PR_NUMBER} (${elapsed}s elapsed)"
              # `set -e` would abort here anyway; spelled out so the job says
              # which thing failed rather than only that gh exited non-zero.
              gh pr checks "${PR_NUMBER}" --watch --fail-fast --interval 10 || {
                echo "::error::a check failed on PR #${PR_NUMBER}"
                exit 1
              }
            fi
            sleep 20
          done

          if [ "${settled}" -ne 1 ]; then
            echo "::error::checks on PR #${PR_NUMBER} did not settle within ${SETTLE_DEADLINE_SECONDS}s"
            exit 1
          fi

          # The loop can only settle on an unchanged count, and the iteration
          # before that watched exactly that set to completion -- so this is
          # already satisfied. Run it anyway: it is seconds when it passes, and
          # the thing it guards against is a silent merge.
          gh pr checks "${PR_NUMBER}" --watch --fail-fast --interval 10 || {
            echo "::error::a check failed on PR #${PR_NUMBER}"
            exit 1
          }
          echo "Merging PR #${PR_NUMBER}"
          gh pr merge "${PR_NUMBER}" --squash --delete-branch
      # The VERSION bump must not fail silently: the target branch would stay
      # out of sync with the published release with nobody watching Actions.
      - uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        if: ${{ failure() && !inputs.dry-run }}
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_BOT_CHANNEL_ID }}"
            text: "VERSION bump to ${{ steps.vars.outputs.version }} did not land on ${{ steps.base.outputs.base }}"
            attachments:
              - color: "#FF0000"
                blocks:
                  - type: "section"
                    fields:
                      - type: "mrkdwn"
                        text: "<${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}|${{ github.workflow }}>"
                      - type: "mrkdwn"
                        text: "*Status:*\n`${{ job.status }}`"
