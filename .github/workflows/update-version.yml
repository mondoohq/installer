name: Update Release Version

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version that should be released'
        required: true
        default: '1.2.3'
      dry-run:
        description: 'Skip PR create/approve/merge/slack (test base-branch decision only)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    env:
      # C07R9GSGKEU == #mondoo-ops
      SLACK_BOT_CHANNEL_ID: "C07R9GSGKEU"
    steps:
      - name: Version from Workflow Dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "VERSION=${INPUT_VERSION#v}" >> "$GITHUB_ENV"
      - name: Version from Release Tag
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
      - name: Verify valid version
        id: vars
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # Sparse-checkout the scripts dir before we know the target branch, so
      # we can run determine-version-bump-base.sh to figure out where to open
      # the bump PR. Pinned to main because on the release event github.ref
      # is the release tag (e.g. refs/tags/v13.35.1 for a v13 patch), and
      # the v13 branch's tag may predate this script's existence. The full
      # checkout of the resolved base branch happens below.
      # It goes in its own directory: dropping it in the workspace root left
      # the second checkout reusing this repo, and a sparse working tree keeps
      # its patterns across that checkout, so VERSION stayed outside the
      # sparse definition and `git add -- VERSION` was silently skipped.
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: '.github/scripts'
          sparse-checkout-cone-mode: false
          path: .bump-scripts
      # Route the VERSION bump to the right branch by comparing the incoming
      # release's major with the major currently on main (read from main's
      # VERSION file). Matching major -> base=main; any other major -> base=
      # v{major} support branch (e.g. a v13.35.1 release while main tracks
      # v14 -> base=v13). Prevents a v13 patch from clobbering main's VERSION.
      # Logic lives in .github/scripts/determine-version-bump-base.sh and is
      # unit-tested via .github/scripts/tests/determine-version-bump-base.bats.
      - name: Determine base branch
        id: base
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(.bump-scripts/.github/scripts/determine-version-bump-base.sh "$VERSION")
          echo "Release: ${VERSION}, resolved base branch: ${BASE}"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.base }}
          fetch-depth: 0
      - name: Prepare title
        id: title
        run: |
          echo "COMMIT_TITLE=Update VERSION to ${VERSION}" >> "$GITHUB_OUTPUT"
          echo "BRANCH_NAME=automation/update-version-${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Write VERSION file
        run: |
          echo "${VERSION}" > VERSION
          echo "VERSION is ${VERSION}"
      # Dry-run stops here after the routing/decision + local file write, so
      # a workflow_dispatch with dry-run=true exercises the routing end to
      # end without opening or approving a real PR.
      - name: Dry run summary
        if: ${{ inputs.dry-run }}
        run: |
          echo "::notice::DRY RUN — no PR opened."
          echo "  version: ${VERSION}"
          echo "  base:    ${{ steps.base.outputs.base }}"
          echo "  branch:  ${{ steps.title.outputs.BRANCH_NAME }}"
          echo "  title:   ${{ steps.title.outputs.COMMIT_TITLE }}"
          echo
          echo "Would have written this VERSION file:"
          cat VERSION
      - name: 🔑 Generate GitHub App Token (mondoohq)
        if: ${{ !inputs.dry-run }}
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id accepts the same value as the old app-id input, see
          # https://github.com/actions/create-github-app-token/blob/v3.1.1/main.js#L21
          client-id: ${{ secrets.MONDOO_MERGEBOT_APP_ID }}
          private-key: ${{ secrets.MONDOO_MERGEBOT_APP_PRIVATE_KEY }}
      - name: Create PR
        if: ${{ !inputs.dry-run }}
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ steps.base.outputs.base }}
          # main requires signed commits; without this the PR is created but
          # merges as BLOCKED. Note that sign-commits makes the action ignore
          # the committer/author inputs and attribute commits to the identity
          # of the token used here (github-actions[bot]).
          sign-commits: true
          commit-message: ${{ steps.title.outputs.COMMIT_TITLE }}
          title: ${{ steps.title.outputs.COMMIT_TITLE }}
          branch: ${{ steps.title.outputs.BRANCH_NAME }}
          delete-branch: true
          add-paths: |
            VERSION
          body: |
            Bumps the `VERSION` file to `${{ steps.vars.outputs.version }}` following the
            release of `v${{ steps.vars.outputs.version }}`.

            Opened automatically by the
            [Update Release Version workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
      - name: Add Audit Trail Comment
        if: ${{ !inputs.dry-run && steps.create-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr comment "${PR_NUMBER}" \
            --body "### 🤖 Automated System Action: Release Version Sync
          This pull request was generated automatically by the Update Release Version workflow after release \`v${VERSION}\` was published.

          It updates only the \`VERSION\` file so the repository matches the published release. It contains no human-authored application code, so it is approved and merged by the automation service account to keep the repository in sync with the release.
          * **Audit Category:** Release Metadata Sync
          * **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Approve Pull Request
        if: ${{ !inputs.dry-run && steps.create-pr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          # The PR is authored by github-actions[bot]; mondoo-mergebot is a
          # separate identity, so this approval satisfies the requirement that
          # every PR is reviewed and approved by someone other than the author.
          echo "Approving PR #${PR_NUMBER}"
          gh pr review "${PR_NUMBER}" --approve
      - name: Merge Pull Request
        if: ${{ !inputs.dry-run && steps.create-pr.outputs.pull-request-number }}
        # Bounded so a required check that never reports fails the job (and
        # fires the Slack alert below) rather than hanging until the job limit.
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          # The merge is attempted seconds after the PR is opened, long before
          # required checks finish, so wait for them first. --watch keeps this
          # synchronous: unlike `gh pr merge --auto`, a failed check or refused
          # merge fails the job instead of silently leaving the PR open.
          #
          # One --watch call is not enough, for two reasons. It only watches
          # checks that exist when it starts, and a second after the PR opens
          # none are registered -- gh calls that a failure ("no checks reported
          # on the ... branch", exit 1) rather than waiting. And they register
          # in waves: on PR #760 GitGuardian registered and completed within a
          # second, seven more arrived 43s later, the last 2m36s after that. A
          # single watch would have returned on that one green check, and main
          # has no required checks to stop the merge.
          #
          # A stable count is not proof either -- across that first 43s window
          # it sits at 1. Settling needs both a stable count and enough elapsed
          # time to cover the gaps. (Requiring these checks on main would make
          # all of this unnecessary; this is the fix available from inside the
          # workflow.)
          #
          # Tuned to that 2m36s spread, so revisit if it grows: wrong low is a
          # merge that skipped its checks, wrong high is a slower release.
          # These live here rather than in a job-level `env` because this step
          # is their only consumer, and the reasoning above is what stops the
          # floor being tidied down to a number that no longer covers it.
          SETTLE_FLOOR_SECONDS=300
          QUIET_SECONDS=60
          # Under the step's timeout-minutes: 20, so the loop reports its own
          # failure rather than being killed mid-wait. A normal run is the
          # floor plus however long the checks take -- about seven minutes on
          # the PR #760 suite.
          SETTLE_DEADLINE_SECONDS=900
          STARTED_AT=$(date +%s)
          GH_ERR="${RUNNER_TEMP:-/tmp}/gh-checks-err"

          # Phase 1: something to watch. Its own budget, so a slow first
          # registration cannot eat the settle phase's retries.
          REGISTER_ATTEMPTS=18
          REGISTER_INTERVAL=10
          registered=0
          for attempt in $(seq 1 "${REGISTER_ATTEMPTS}"); do
            echo "Waiting for checks to register on PR #${PR_NUMBER} (attempt ${attempt}/${REGISTER_ATTEMPTS})"
            # Three guards on one number, because every later [ ] comparison
            # is arithmetic and an erroring comparison reads as false -- the
            # guards would silently not fire. grep -Ex rejects anything that is
            # not the count (gh exiting 0 having printed a notice to stdout),
            # `|| echo 0` covers gh exiting non-zero, ${x:-0} covers no output
            # at all. stderr reaches the log rather than /dev/null, where an
            # auth or network failure would look exactly like "no checks yet".
            registered=$(gh pr view "${PR_NUMBER}" --json statusCheckRollup \
              --jq '.statusCheckRollup | length' 2>"${GH_ERR}" \
              | grep -Ex '[0-9]+' || echo 0)
            registered=${registered:-0}
            [ -s "${GH_ERR}" ] && echo "::warning::gh pr view: $(tr '\n' ' ' < "${GH_ERR}")"
            [ "${registered}" -gt 0 ] && break
            sleep "${REGISTER_INTERVAL}"
          done
          if [ "${registered}" -eq 0 ]; then
            echo "::error::no checks registered on PR #${PR_NUMBER} after $(( REGISTER_ATTEMPTS * REGISTER_INTERVAL ))s"
            exit 1
          fi

          # Phase 2: watch what is there, look again, repeat until the set has
          # stopped growing and enough time has passed for a late arrival to
          # show up. QUIET_SECONDS runs from the last actual change, making it
          # a real quiet period rather than "unchanged across one poll"; the
          # floor then guarantees a minimum total wait however the changes fell.
          #
          # Bounded by elapsed time, not an iteration count: each pass blocks
          # in --watch for however long the slowest check takes, so iterations
          # would give up after an unpredictable amount of time.
          settled=0
          previous=-1
          last_change_at=${STARTED_AT}
          while [ "$(( $(date +%s) - STARTED_AT ))" -lt "${SETTLE_DEADLINE_SECONDS}" ]; do
            count=$(gh pr view "${PR_NUMBER}" --json statusCheckRollup \
              --jq '.statusCheckRollup | length' 2>"${GH_ERR}" \
              | grep -Ex '[0-9]+' || echo 0)
            count=${count:-0}
            [ -s "${GH_ERR}" ] && echo "::warning::gh pr view: $(tr '\n' ' ' < "${GH_ERR}")"
            now=$(date +%s)
            elapsed=$(( now - STARTED_AT ))

            if [ "${count}" -ne "${previous}" ]; then
              last_change_at=${now}
              previous="${count}"
            fi

            # count > 0 is part of the condition, not just its stability: a
            # persistent 0 is stable too, and the loop would settle on having
            # watched nothing. It does not end the loop though -- phase 1
            # proved checks exist, so a 0 is the API flapping, and we poll on
            # until it recovers or the deadline gives up.
            if [ "${count}" -gt 0 ] \
              && [ "$(( now - last_change_at ))" -ge "${QUIET_SECONDS}" ] \
              && [ "${elapsed}" -ge "${SETTLE_FLOOR_SECONDS}" ]; then
              settled=1
              break
            fi

            # --watch blocks for as long as the slowest registered check runs,
            # and that is intended: last_change_at marks when the check *set*
            # last changed, and a slow check is not the set changing. New
            # checks arriving during the watch are caught by the next poll,
            # which resets the clock -- the signal QUIET_SECONDS measures.
            #
            # So a run costs the floor plus the longest check, and the deadline
            # has to clear floor + longest check + margin. Re-watching a green
            # set is near free: nothing pending, it returns immediately.
            if [ "${count}" -gt 0 ]; then
              echo "Watching ${count} check(s) on PR #${PR_NUMBER} (${elapsed}s elapsed)"
              # `set -e` would abort here anyway; spelled out so the job says
              # which thing failed rather than only that gh exited non-zero.
              gh pr checks "${PR_NUMBER}" --watch --fail-fast --interval 10 || {
                echo "::error::a check failed on PR #${PR_NUMBER}"
                exit 1
              }
            fi
            # Pacing, not waiting: the floor is a lower bound on elapsed time,
            # so dropping this would poll harder to fill the same window.
            sleep 20
          done

          if [ "${settled}" -ne 1 ]; then
            echo "::error::checks on PR #${PR_NUMBER} did not settle within ${SETTLE_DEADLINE_SECONDS}s"
            exit 1
          fi

          # Already satisfied: the loop settles only on an unchanged count,
          # and the iteration before watched that set to completion. Run it
          # anyway -- seconds when it passes, and it guards a silent merge.
          gh pr checks "${PR_NUMBER}" --watch --fail-fast --interval 10 || {
            echo "::error::a check failed on PR #${PR_NUMBER}"
            exit 1
          }
          echo "Merging PR #${PR_NUMBER}"
          gh pr merge "${PR_NUMBER}" --squash --delete-branch
      # The VERSION bump must not fail silently: the target branch would stay
      # out of sync with the published release with nobody watching Actions.
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        if: ${{ failure() && !inputs.dry-run }}
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_BOT_CHANNEL_ID }}"
            text: "VERSION bump to ${{ steps.vars.outputs.version }} did not land on ${{ steps.base.outputs.base }}"
            attachments:
              - color: "#FF0000"
                blocks:
                  - type: "section"
                    fields:
                      - type: "mrkdwn"
                        text: "<${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}|${{ github.workflow }}>"
                      - type: "mrkdwn"
                        text: "*Status:*\n`${{ job.status }}`"
