name: Releases.mondoo.com File Validation

on:
  schedule:
    - cron: '*/15 * * * *'  # Run every 15 minutes
  workflow_dispatch:  # Allow manual triggers

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on:
      group: arc-walkers
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
    - name: Validate Mondoo releases
      id: mondoo
      continue-on-error: true
      run: uv run test/releases/validate_release.py mondoo
    - name: Validate mql releases
      id: mql
      continue-on-error: true
      run: uv run test/releases/validate_release.py mql
    - name: Validate cnspec releases
      id: cnspec
      continue-on-error: true
      run: uv run test/releases/validate_release.py cnspec
    - name: Validate Mondoo preview releases
      id: mondoo-preview
      continue-on-error: true
      run: uv run test/releases/validate_release.py mondoo --channel preview
    - name: Validate mql preview releases
      id: mql-preview
      continue-on-error: true
      run: uv run test/releases/validate_release.py mql --channel preview
    - name: Validate cnspec preview releases
      id: cnspec-preview
      continue-on-error: true
      run: uv run test/releases/validate_release.py cnspec --channel preview
    # mql and cnspec are released in lockstep, so a channel that points them at
    # different versions for longer than a release takes means an indexing pass
    # did not reach both. Neither product's own validation can see that.
    - name: Validate channel consistency
      id: channels
      continue-on-error: true
      run: uv run test/releases/validate_release.py channels
    - name: Summarize results
      id: summary
      if: always()
      env:
        OUTCOMES: >-
          ${{ steps.mondoo.outcome }} ${{ steps.mql.outcome }} ${{ steps.cnspec.outcome }}
          ${{ steps.mondoo-preview.outcome }} ${{ steps.mql-preview.outcome }} ${{ steps.cnspec-preview.outcome }}
          ${{ steps.channels.outcome }}
      run: |
        if [[ "$OUTCOMES" == *failure* ]]; then
          echo "failed=true" >> "$GITHUB_OUTPUT"
        else
          echo "failed=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Send Slack notification on failure
      if: steps.summary.outputs.failed == 'true'
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
      with:
        method: chat.postMessage
        token: ${{ secrets.SLACK_BOT_TOKEN }}
        payload: |
          {
            "channel": "C07QZDJFF89",
            "text": "⚠️ Release File Validation Failures Detected",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "⚠️ Release File Validation Failures"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Validation Results:*"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*stable*\n${{ steps.mondoo.outcome == 'failure' && '• Mondoo: ❌ Failed\n' || '• Mondoo: ✅ Passed\n' }}${{ steps.mql.outcome == 'failure' && '• mql: ❌ Failed\n' || '• mql: ✅ Passed\n' }}${{ steps.cnspec.outcome == 'failure' && '• cnspec: ❌ Failed\n' || '• cnspec: ✅ Passed\n' }}\n*preview*\n${{ steps.mondoo-preview.outcome == 'failure' && '• Mondoo: ❌ Failed\n' || '• Mondoo: ✅ Passed\n' }}${{ steps.mql-preview.outcome == 'failure' && '• mql: ❌ Failed\n' || '• mql: ✅ Passed\n' }}${{ steps.cnspec-preview.outcome == 'failure' && '• cnspec: ❌ Failed\n' || '• cnspec: ✅ Passed\n' }}\n${{ steps.channels.outcome == 'failure' && '*Channel consistency:* ❌ mql and cnspec disagree' || '*Channel consistency:* ✅ Passed' }}"
                }
              },
              {

                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View GitHub Action Run>"
                  }
                ]
              }
            ]
          }
    - name: Final status check
      if: steps.summary.outputs.failed == 'true'
      run: exit 1
