---
name: POSIX Shell Compatibility

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'install.sh'
      - 'download.sh'
      # Globbed to match the loop below. Listing the scripts individually meant
      # a newly added one would not trigger this job, and would then be checked
      # only when some other listed file happened to change in the same PR --
      # the same disagreement between trigger and check that put download.sh
      # in this list without ever checking it.
      - 'test/install_sh/*.sh'
      - '.github/workflows/test_posix_compat.yml'

permissions:
  contents: read

jobs:
  posix-sh-check:
    name: POSIX sh compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install checkbashisms
        run: sudo apt-get update && sudo apt-get install -y devscripts

      # The test scripts are #!/bin/sh too, and they were being executed
      # without ever being linted -- so a bashism in one of them would only
      # surface if it happened to be reached on a runner whose /bin/sh is
      # bash, which on ubuntu-latest it is not. They pass all three checks
      # today, which is why this is the moment to wire them in.
      - name: Check POSIX compliance
        run: |
          set -eu
          status=0
          for f in install.sh download.sh test/install_sh/*.sh; do
            # An unmatched glob expands to the literal pattern in POSIX sh, so
            # confirm there is a file here. Failing is deliberate: skipping
            # would let this job report success having checked nothing, which
            # is the failure it exists to prevent.
            [ -f "$f" ] || {
              echo "::error::no file matches '$f' -- nothing was checked"
              exit 1
            }

            echo "==> $f"

            head -1 "$f" | grep -q '^#!/bin/sh' || {
              echo "::error file=$f::shebang is not #!/bin/sh"
              status=1
            }

            checkbashisms "$f" || status=1
            shellcheck -s sh -S warning "$f" || status=1
            dash -n "$f" || status=1
          done
          exit "$status"

      - name: Test parameter passing
        run: sh test/install_sh/test_params.sh

      - name: Test cnspec status probe
        run: sh test/install_sh/test_status_timeout.sh

      - name: Test architecture detection
        run: sh test/install_sh/test_arch_detect.sh
