name: Test Linux Packaging

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to test (e.g. 13.0.0-rc7)'
        required: true
        type: string
      releases-url:
        description: 'Releases base URL'
        required: false
        default: 'https://releases.mondoo.love'
        type: string
      self-upgrade-from:
        description: 'Version to self-upgrade from (e.g. 13.0.0-rc5); leave empty to skip'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version to test'
        required: true
        type: string
      releases-url:
        description: 'Releases base URL'
        required: false
        default: 'https://releases.mondoo.love'
        type: string
      self-upgrade-from:
        description: 'Version to self-upgrade from; leave empty to skip'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  test-mondoo-pkg-and-upgrade:
    name: Mondoo pkg + Upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run mondoo-pkg and upgrade tests
        env:
          INSTALL_VERSION: ${{ inputs.version }}
          RELEASES_URL: ${{ inputs.releases-url || 'https://releases.mondoo.love' }}
        run: |
          python3 test/auto_update/test_auto_update.py \
            --install-version "${INSTALL_VERSION}" \
            --releases-url "${RELEASES_URL}" \
            --skip-auto-update \
            --skip-self-upgrade

  test-auto-update:
    name: Auto-update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run auto-update tests
        env:
          INSTALL_VERSION: ${{ inputs.version }}
          RELEASES_URL: ${{ inputs.releases-url || 'https://releases.mondoo.love' }}
        run: |
          python3 test/auto_update/test_auto_update.py \
            --install-version "${INSTALL_VERSION}" \
            --releases-url "${RELEASES_URL}" \
            --skip-mondoo-pkg \
            --skip-upgrade \
            --skip-self-upgrade

  test-self-upgrade:
    name: Self-upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.self-upgrade-from != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run self-upgrade tests
        env:
          INSTALL_VERSION: ${{ inputs.version }}
          RELEASES_URL: ${{ inputs.releases-url || 'https://releases.mondoo.love' }}
          SELF_UPGRADE_FROM: ${{ inputs.self-upgrade-from }}
        run: |
          python3 test/auto_update/test_auto_update.py \
            --install-version "${INSTALL_VERSION}" \
            --releases-url "${RELEASES_URL}" \
            --skip-auto-update \
            --skip-mondoo-pkg \
            --skip-upgrade \
            --self-upgrade-from "${SELF_UPGRADE_FROM}"
