name: "PKG: Package, Release, Reindex"

on:
  release:
    # `published`, not `[released, prereleased]`.
    #
    # `prereleased` fires when a pre-release is *created*, which is not when we
    # need it. v14.0.0-rc.3's release object was created hours before it was
    # published, so by publish time that activity had long passed and this
    # workflow never ran -- while test-released-all.yaml, which listens to
    # `published`, fired on the same release.
    #
    # The event type was never doing real work anyway: every job below gates on
    # `needs.parse-inputs.outputs.channel`, derived from the version itself.
    # Keying off the type as well was a second, less reliable copy of a decision
    # already made. See minstaller ADR 0003.
    types: [published]
  workflow_dispatch:
    inputs:
      skip-publish:
        description: "Do not publish the packages"
        type: boolean
        default: false
      version:
        description: "Package Version (e.g. v8.99.99)"
        required: true
        default: "v8.99.99"
        type: "string"
      bucket:
        description: "GCP Release Bucket Name"
        required: true
        default: "releases-us.mondoo.io"
        type: choice
        options:
          - "releases-us.mondoo.io"
          - "releases-com-test"
      reindex-path:
        description: "Path to Reindex (e.g. 8.99.99)"
        required: false
        type: string
      reindex-full:
        description: "Regenerate ALL indexes (Intensive!)"
        required: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  # C07QZDJFF89 == #release-coordination
  SLACK_BOT_CHANNEL_ID: "C07QZDJFF89"

jobs:
  parse-inputs:
    uses: ./.github/workflows/parse_inputs.yml
    with:
      skip-publish: ${{ inputs.skip-publish }}
      version: ${{ (github.event_name == 'workflow_dispatch' && inputs.version) || github.event.release.tag_name }}
      bucket: ${{ inputs.bucket }}

  # Posts after parse-inputs rather than before it, because the message names
  # the version and the channel, and only parse-inputs has validated them. The
  # packaging jobs wait on parse-inputs only, so this does not hold them up.
  #
  # always(): update-notify runs regardless and needs a message to update, so a
  # version parse-inputs rejected still gets posted -- and then reported red.
  notify:
    if: ${{ always() }}
    needs: [parse-inputs]
    runs-on: ubuntu-latest
    outputs:
      update-ts: ${{ steps.slack.outputs.ts }}
      channel-line: ${{ steps.meta.outputs.channel_line }}
    steps:
      - name: Compose Slack message
        id: meta
        env:
          CHANNEL: ${{ needs.parse-inputs.outputs.channel }}
        run: |
          # The channel decides which half of this workflow runs, so it is the first
          # thing a reader needs in order to know whether a row of "Skipped" is
          # correct or alarming.
          case "$CHANNEL" in
            stable)  echo "channel_line=:package: *stable* — packaged for apt, yum, chocolatey, homebrew and AUR" >> "$GITHUB_OUTPUT" ;;
            preview) echo "channel_line=:test_tube: *preview* — bucket and signed installers only; the OS repositories are deliberately untouched" >> "$GITHUB_OUTPUT" ;;
            *)       echo "channel_line=:grey_question: *unknown channel* — the version did not parse" >> "$GITHUB_OUTPUT" ;;
          esac
      - id: slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_BOT_CHANNEL_ID }}"
            text: ":hourglass_flowing_sand: Mondoo package v${{ needs.parse-inputs.outputs.version }} publishing"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: ":hourglass_flowing_sand: Mondoo package v${{ needs.parse-inputs.outputs.version }} publishing"
                  emoji: true
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.meta.outputs.channel_line }}"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Repository:*\n`${{ github.repository }}`"
                  - type: "mrkdwn"
                    text: "*Version:*\n`v${{ needs.parse-inputs.outputs.version }}`"
                  - type: "mrkdwn"
                    text: "*Triggered by:*\n${{ github.actor }}"
                  - type: "mrkdwn"
                    text: "*Workflow run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run>"

  # Asserts that a version parse-inputs called stable really is one. It runs only
  # on stable and blocks nothing by itself -- the jobs that must stay stable-only
  # (build-arch, build-chocolatey, build-homebrew) carry their own channel
  # condition. What it does do is fail the run, and `reindex` refuses to publish
  # to the bucket when it has failed, so a version that disagrees with its
  # channel stops the release rather than shipping.
  #
  # It used to also gate build-mondoo-pkgs, and that was the wrong granularity.
  # That job does two things with different audiences: it uploads versioned deb
  # and rpm artifacts to the bucket, and it tells repobuilder to fold the version
  # into the apt and yum repositories. Gating the whole job to keep release
  # candidates out of apt also kept them out of the bucket, which is why Linux
  # was the one platform with no preview artifacts at all while Windows and macOS
  # had them. The gate now sits on the half that needs it -- the update-downstream
  # job in release_mondoo_pkgs.yaml, which derives the channel from the version.
  #
  # A pre-release skips these jobs rather than failing the run: the run is
  # expected and its other half has work to do.
  check-version:
    needs: [parse-inputs]
    if: ${{ needs.parse-inputs.outputs.channel == 'stable' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          VERSION: ${{ needs.parse-inputs.outputs.version }}
        run: |
          echo "Checking version: $VERSION"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "❌ Prerelease versions are not allowed ($VERSION)"
            exit 1
          fi
          echo "✅ Version $VERSION is allowed"

  # Channel-independent, unlike the other packaging jobs. This one only
  # `gsutil cp`s a versioned artifact into the bucket
  # (mondoo/<version>/mondoo_<version>_windows_<arch>.msi), so a pre-release is
  # invisible until someone asks for it by version or through the preview
  # channel. apt, yum, chocolatey, homebrew and AUR have a single stream with no
  # channel concept, which is why those stay behind check-version.
  #
  # Without this a preview user on Windows could only take the zip, not the
  # installer -- on the platform where the installer is how people install.
  build-msi:
    uses: ./.github/workflows/pkg_msi.yaml
    needs: [parse-inputs]
    secrets:
      TSIGN_AZURE_CLIENT_ID: ${{ secrets.TSIGN_AZURE_CLIENT_ID }}
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      INSTALL_TEST_MONDOO_REGISTRATION_TOKEN: ${{ secrets.INSTALL_TEST_MONDOO_REGISTRATION_TOKEN }}
    with:
      version: ${{ needs.parse-inputs.outputs.version }}
      skip-publish: ${{ needs.parse-inputs.outputs.skip-publish == 'true' }}
      bucket: ${{ needs.parse-inputs.outputs.bucket }}
  # Channel-independent, like build-msi and build-macos. The packages land in
  # mondoo/<version>/ and reach a client only by version or by asking for the
  # preview channel; the apt/yum publication is gated separately inside this
  # workflow. Without this a preview user on Linux had no installable package at
  # all, while Windows and macOS had one.
  build-mondoo-pkgs:
    permissions:
      contents: write
    uses: ./.github/workflows/release_mondoo_pkgs.yaml
    needs: [parse-inputs]
    secrets:
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      GPG_KEY: ${{ secrets.GPG_KEY }}
      GPG_PUBKEY: ${{ secrets.GPG_PUBKEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      REPO_API_TOKEN: ${{ secrets.REPO_API_TOKEN }}
    with:
      version: ${{ needs.parse-inputs.outputs.version }}
      skip-publish: ${{ needs.parse-inputs.outputs.skip-publish == 'true' }}
      bucket: ${{ needs.parse-inputs.outputs.bucket }}
  # Channel-independent for the same reason as build-msi: it publishes only
  # mondoo/<version>/<name>_<version>_darwin_universal.pkg. Signed and notarized
  # either way -- an unsigned pre-release pkg would be worse than none, since
  # Gatekeeper would block it and the workaround teaches a bad habit.
  build-macos:
    uses: ./.github/workflows/pkg_macos.yaml
    needs: [parse-inputs]
    secrets:
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_KEYS_PRODUCTSIGN_P12: ${{ secrets.APPLE_KEYS_PRODUCTSIGN_P12 }}
      APPLE_KEYS_CODESIGN_P12: ${{ secrets.APPLE_KEYS_CODESIGN_P12 }}
      APPLE_KEYS_PASSWORD: ${{ secrets.APPLE_KEYS_PASSWORD }}
      APPLE_KEYS_CODESIGN_ID: ${{ secrets.APPLE_KEYS_CODESIGN_ID }}
      APPLE_KEYS_PRODUCTSIGN_ID: ${{ secrets.APPLE_KEYS_PRODUCTSIGN_ID }}
      APPLE_ACCOUNT_USERNAME: ${{ secrets.APPLE_ACCOUNT_USERNAME }}
      APPLE_ACCOUNT_PASSWORD: ${{ secrets.APPLE_ACCOUNT_PASSWORD }}
      APPLE_ACCOUNT_TEAM_ID: ${{ secrets.APPLE_ACCOUNT_TEAM_ID }}
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
    with:
      version: ${{ needs.parse-inputs.outputs.version }}
      skip-publish: ${{ needs.parse-inputs.outputs.skip-publish == 'true' }}
      bucket: ${{ needs.parse-inputs.outputs.bucket }}
  # Copies the cnspec and mql binaries into the release bucket and regenerates
  # the indexes, which is what puts a release on releases.mondoo.com and into
  # its channel's pointer document. Runs for every channel.
  #
  # Maintenance note: a GitHub Actions `if:` expression cannot call a composite
  # action or share a named expression, so each packaging job has to be listed
  # here by hand. Add a build-* job to `needs` below and it must be added to
  # this condition too, or a failure in it would no longer block publication.
  #
  # `!cancelled()` rather than `always()`: the packaging jobs it waits on are
  # skipped on a pre-release, and a skipped dependency would otherwise skip this
  # too — but `always()` would also publish to the bucket after someone cancels
  # the run, which is an outward-facing side effect nobody asked for. The
  # explicit result checks keep a *failed* packaging job from publishing.
  reindex:
    runs-on: ubuntu-latest
    needs:
      [check-version, parse-inputs, build-mondoo-pkgs, build-macos, build-msi]
    if: >-
      ${{
        !cancelled() &&
        needs.parse-inputs.result == 'success' &&
        !contains(fromJSON('["failure", "cancelled"]'), needs.check-version.result) &&
        !contains(fromJSON('["failure", "cancelled"]'), needs.build-mondoo-pkgs.result) &&
        !contains(fromJSON('["failure", "cancelled"]'), needs.build-macos.result) &&
        !contains(fromJSON('["failure", "cancelled"]'), needs.build-msi.result)
      }}
    steps:
      # fetch a token for the mondoo-mergebot app
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id accepts the same value as the old app-id input, see
          # https://github.com/actions/create-github-app-token/blob/v3.1.1/main.js#L21
          client-id: ${{ secrets.MONDOO_MERGEBOT_APP_ID }}
          private-key: ${{ secrets.MONDOO_MERGEBOT_APP_PRIVATE_KEY }}
          owner: mondoohq
          repositories: |
            installer
            releasr
            cnspec
            mql
      - name: Converge Inputs
        id: inputs
        env:
          BUCKET: ${{ needs.parse-inputs.outputs.bucket }}
          REINDEX_PATH: ${{ inputs.reindex-path }}
        run: |
          # reindex-path is the one free-text input on this workflow -- bucket is
          # a choice and version is validated by parse_inputs -- and it is spliced
          # into a `gsutil rm` and a CDN invalidation below. Validate it here,
          # once, where it enters, rather than quoting it at each use: the same
          # reasoning parse_inputs.yml gives for validating the version there.
          #
          # Matched a segment at a time rather than as one flat class, because a
          # GCS object name is a literal string: nothing normalises it. A path
          # that merely looks odd resolves to an object that does not exist, and
          # the `gsutil rm ... || true` below then reports success having removed
          # nothing. `foo/` asks for `foo//artifacts.json`, and `a/./b` asks for
          # a directory named `.` -- neither is the file anyone meant.
          #
          # Requiring each segment to start alphanumeric is what rejects those,
          # and it subsumes the `..` check this replaced: `..` cannot be a whole
          # segment if every segment begins with a letter or digit. It also rules
          # out a leading `/`, `-` or `.`, and an empty segment from `//`.
          #
          # The character class is what a GCS object prefix needs and nothing
          # more, so it admits nothing that means anything to a shell. `a..b`
          # stays legal: dots inside a segment are not a traversal, and the CDN
          # invalidation this also feeds reads it as a URL path where only a
          # whole `..` segment would be.
          if [ -n "${REINDEX_PATH}" ]; then
            if [[ ! "${REINDEX_PATH}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*)*$ ]]; then
              echo "::error::invalid reindex-path: ${REINDEX_PATH}"
              exit 1
            fi
          fi

          # The CDN default lives here rather than as an `|| '*'` fallback in the
          # template at the point of use. An unset path means "invalidate
          # everything", which is worth reading in one place instead of inferring
          # it from a fallback buried in a command line.
          #
          # Note the fallback could not simply be quoted where it stood: Actions
          # expands a template anywhere in a `run:` block, comments included, so
          # the value has to stop being a template to stop being a splice.
          CACHE_INVALIDATION_PATH="${REINDEX_PATH:-*}"

          printf 'bucket=%s\n' "${BUCKET}" >> "$GITHUB_OUTPUT"
          printf 'reindex-path=%s\n' "${REINDEX_PATH}" >> "$GITHUB_OUTPUT"
          printf 'cache-invalidation-path=%s\n' "${CACHE_INVALIDATION_PATH}" >> "$GITHUB_OUTPUT"
      - name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093" # v3.0.0
        with:
          credentials_json: "${{secrets.GCP_CREDENTIALS}}"
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db" # v3.0.1
      - name: Get GCP TOKEN
        id: auth
        run: echo "id_token=$(gcloud auth print-identity-token)" >> "$GITHUB_OUTPUT"
      - name: Get latest Releasr Binary
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1
        with:
          repository: mondoohq/releasr
          latest: true
          fileName: releasr
          out-file-path: .
          token: ${{ steps.generate-token.outputs.token }}
      - name: Make releasr executable
        run: |
          chmod +x releasr
      - name: Release cnspec & mql binaries
        env:
          TOKEN: ${{ steps.auth.outputs.id_token }}
          BUCKETNAME: ${{ needs.parse-inputs.outputs.bucket }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ needs.parse-inputs.outputs.version }}
          SKIP: ${{ (needs.parse-inputs.outputs.skip-publish == 'true') && 'echo skipping...' || '' }}
        run: |
          # BUCKETNAME was already declared above and then not used; the step
          # interpolated the same two values straight into the command instead.
          $SKIP ./releasr release cp "https://github.com/mondoohq/mql/releases/tag/v${VERSION}" "gs://${BUCKETNAME}"
          $SKIP ./releasr release cp "https://github.com/mondoohq/cnspec/releases/tag/v${VERSION}" "gs://${BUCKETNAME}"
      - name: "Remove Artifacts.json & Index.html from path (Optional)"
        env:
          BUCKETNAME: ${{ needs.parse-inputs.outputs.bucket }}
          REINDEX_PATH: ${{ steps.inputs.outputs.reindex-path }}
          SKIP: ${{ (needs.parse-inputs.outputs.skip-publish == 'true') && 'echo skipping...' || '' }}
        run: |
          # Reads the value Converge Inputs validated, not the raw input.
          if [ -n "${REINDEX_PATH}" ]; then
            echo "Removing artifacts.json & index.html from path ${REINDEX_PATH}"
            # If the files don't exist this will fail, but that's ok
            $SKIP gsutil rm "gs://${BUCKETNAME}/${REINDEX_PATH}/artifacts.json" || true
            $SKIP gsutil rm "gs://${BUCKETNAME}/${REINDEX_PATH}/index.html" || true
          fi
      - name: Regenerate Release Indexes
        env:
          TOKEN: ${{ steps.auth.outputs.id_token }}
          BUCKETNAME: ${{ needs.parse-inputs.outputs.bucket }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          BUCKET: ${{ needs.parse-inputs.outputs.bucket }}
          VERSION: ${{ needs.parse-inputs.outputs.version }}
          REINDEX_FULL: ${{ inputs.reindex-full }}
          SKIP: ${{ (needs.parse-inputs.outputs.skip-publish == 'true') && 'echo skipping...' || '' }}
        run: |
          # A release writes three trees: mondoo/<version> for the msi, pkg and OS
          # packages, and mql/<version> and cnspec/<version> for the binaries. Index
          # those, and let --update-parent rewrite each app's channel pointers from
          # every version it holds.
          #
          # An unscoped pass rebuilds the index for every product in the bucket, which
          # makes a release depend on the health of objects it has no relationship
          # with. On v14.0.0-rc.6 an unreadable file under edge/ ended the pass before
          # cnspec/ was reached, so cnspec's preview pointer stayed a release behind
          # while mql's moved: reverse-alphabetical order decided which products
          # published.
          #
          # A full pass still repairs the bucket after a change to the generator. It
          # just does not belong on the release path.
          if [ "${REINDEX_FULL}" = "true" ]; then
            $SKIP ./releasr idx "gs://${BUCKET}" --force-recompute
          else
            $SKIP ./releasr idx "gs://${BUCKET}" \
              --app "mondoo/${VERSION},mql/${VERSION},cnspec/${VERSION}" \
              --update-parent
          fi
      - name: Restart minstaller Cloud Run Service
        env:
          MINSTALLER: ${{ (needs.parse-inputs.outputs.skip-publish == 'true') && 'minstaller-dev' || 'minstaller' }}
        run: |
          gcloud --project mondoo-base-infra \
              run services describe "$MINSTALLER" --region us-central1 --format export > "$MINSTALLER.yaml"
          gcloud --project mondoo-base-infra \
              run services replace "$MINSTALLER.yaml" --region us-central1
          rm "$MINSTALLER.yaml"
      - name: Invalidate Google Load Balancer caches (ETA~10 minutes)
        env:
          CACHE_INVALIDATION_PATH: ${{ steps.inputs.outputs.cache-invalidation-path }}
        run: |
          gcloud compute url-maps invalidate-cdn-cache releases-mondoo-io --path "/${CACHE_INVALIDATION_PATH}"
  build-arch:
    # Packaging: stable only. See check-version.
    if: ${{ needs.parse-inputs.outputs.channel == 'stable' }}
    uses: ./.github/workflows/pkg_arch-aur.yaml
    needs: [parse-inputs, reindex]
    secrets:
      AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
      AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    with:
      version: ${{ needs.parse-inputs.outputs.version }}
      skip: ${{ needs.parse-inputs.outputs.skip-publish == 'true' }}
  build-chocolatey:
    # Packaging: stable only. See check-version.
    if: ${{ needs.parse-inputs.outputs.channel == 'stable' }}
    uses: ./.github/workflows/pkg_chocolatey.yaml
    needs: [parse-inputs, reindex]
    secrets:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    with:
      version: ${{ needs.parse-inputs.outputs.version }}
      skip-publish: ${{ needs.parse-inputs.outputs.skip-publish == 'true' }}
  build-container:
    # Packaging: stable only. See check-version.
    if: ${{ needs.parse-inputs.outputs.skip-publish != 'true' && needs.parse-inputs.outputs.channel == 'stable' }}
    needs: [parse-inputs, reindex]
    uses: ./.github/workflows/build_container.yml
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    with:
      version: ${{ needs.parse-inputs.outputs.version }}
      skip-publish: ${{ needs.parse-inputs.outputs.skip-publish == 'true' }}
  build-homebrew:
    # Packaging: stable only. See check-version.
    if: ${{ needs.parse-inputs.outputs.channel == 'stable' }}
    needs: [parse-inputs, reindex]
    # Pinned like every other `uses:` in this repository. It matters more here
    # than most: this call passes `secrets: inherit`, so a mutable ref hands
    # every secret this workflow holds to whatever master points at.
    # homebrew-mondoo publishes no tags, so this is a commit SHA.
    uses: mondoohq/homebrew-mondoo/.github/workflows/release.yml@69d5323ed7ea23a3eff2df3235bea621eff7460a # master @ 2026-09-08
    # TODO(mondoohq/homebrew-mondoo#59): Replace secrets: inherit with explicit
    # secrets after adding secrets declarations to the homebrew-mondoo workflow_call
    # trigger. Required secrets: MONDOO_MERGEBOT_APP_ID, MONDOO_MERGEBOT_APP_PRIVATE_KEY
    secrets: inherit
    with:
      version: ${{ needs.parse-inputs.outputs.version }}
      skip-publish: ${{ needs.parse-inputs.outputs.skip-publish == 'true' }}

  update-notify:
    # always(), deliberately: this job's entire purpose is to close out the
    # Slack message with the run's outcome, so it has to run when that outcome
    # is failure or cancellation. Guarding it on its dependencies would leave a
    # broken run showing "In Progress" forever.
    if: ${{ always() }}
    # Every job whose result this message reports has to be in `needs`:
    # `needs.<job>` for a job that is not a dependency evaluates to empty,
    # so a missing entry renders as "Not run" rather than failing.
    needs:
      [
        notify,
        parse-inputs,
        reindex,
        build-msi,
        build-macos,
        build-mondoo-pkgs,
        build-arch,
        build-chocolatey,
        build-container,
        build-homebrew,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Set status
        id: status
        env:
          # A pre-release skips every packaging job, so requiring all of these to
          # be 'success' would post red on every successful pre-release run. Green
          # means nothing failed; skipped is not failed. Every job reported as a
          # field below is counted here, or the message shows a red row under a
          # green header.
          RESULTS: >-
            ${{ needs.reindex.result }}
            ${{ needs.build-msi.result }}
            ${{ needs.build-macos.result }}
            ${{ needs.build-mondoo-pkgs.result }}
            ${{ needs.build-chocolatey.result }}
            ${{ needs.build-container.result }}
            ${{ needs.build-homebrew.result }}
            ${{ needs.build-arch.result }}
          VERSION: ${{ needs.parse-inputs.outputs.version }}
          R_REINDEX: ${{ needs.reindex.result }}
          R_MSI: ${{ needs.build-msi.result }}
          R_MACOS: ${{ needs.build-macos.result }}
          R_PKGS: ${{ needs.build-mondoo-pkgs.result }}
          R_CHOCO: ${{ needs.build-chocolatey.result }}
          R_BREW: ${{ needs.build-homebrew.result }}
          R_ARCH: ${{ needs.build-arch.result }}
          R_CONTAINER: ${{ needs.build-container.result }}
        run: |
          set -euo pipefail
          ok=true
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) ok=false ;;
            esac
          done
          echo "results: $RESULTS -> success=$ok"
          echo "status_success=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" = "true" ]; then
            echo "header=:rocket: Mondoo package v${VERSION} published" >> "$GITHUB_OUTPUT"
            echo "mention=" >> "$GITHUB_OUTPUT"
          else
            echo "header=:x: Mondoo package v${VERSION} failed to publish" >> "$GITHUB_OUTPUT"
            echo "mention=<!here> " >> "$GITHUB_OUTPUT"
          fi

          # Emits the value only. The label and the newline stay in the Slack payload,
          # where `\n` inside a double-quoted YAML scalar is a real escape — relying on
          # a substituted `\n` being re-read as one would work by accident of when
          # GitHub interpolates, and break the day that changes.
          status() {
            case "$1" in
              success) echo ":white_check_mark: Done" ;;
              skipped) echo ":double_vertical_bar: Skipped" ;;
              "")      echo ":grey_question: Not run" ;;
              *)       echo ":x: $1" ;;
            esac
          }
          {
            echo "s_reindex=$(status "$R_REINDEX")"
            echo "s_msi=$(status "$R_MSI")"
            echo "s_macos=$(status "$R_MACOS")"
            echo "s_pkgs=$(status "$R_PKGS")"
            echo "s_choco=$(status "$R_CHOCO")"
            echo "s_brew=$(status "$R_BREW")"
            echo "s_arch=$(status "$R_ARCH")"
            echo "s_container=$(status "$R_CONTAINER")"
          } >> "$GITHUB_OUTPUT"
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        if: ${{ always() }}
        with:
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_BOT_CHANNEL_ID }}"
            ts: "${{ needs.notify.outputs.update-ts }}"
            text: "${{ steps.status.outputs.mention }}${{ steps.status.outputs.header }}"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "${{ steps.status.outputs.header }}"
                  emoji: true
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ needs.notify.outputs.channel-line }}"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Repository:*\n`${{ github.repository }}`"
                  - type: "mrkdwn"
                    text: "*Version:*\n`v${{ needs.parse-inputs.outputs.version }}`"
                  - type: "mrkdwn"
                    text: "*Triggered by:*\n${{ github.actor }}"
                  - type: "mrkdwn"
                    text: "*Workflow run:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run>"
                  - type: "mrkdwn"
                    text: "*Release notes:*\n<https://github.com/${{ github.repository }}/releases/tag/v${{ needs.parse-inputs.outputs.version }}|v${{ needs.parse-inputs.outputs.version }}>"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Bucket + indexes:*\n${{ steps.status.outputs.s_reindex }}"
                  - type: "mrkdwn"
                    text: "*Windows MSI:*\n${{ steps.status.outputs.s_msi }}"
                  - type: "mrkdwn"
                    text: "*macOS pkg:*\n${{ steps.status.outputs.s_macos }}"
                  - type: "mrkdwn"
                    text: "*apt / yum:*\n${{ steps.status.outputs.s_pkgs }}"
                  - type: "mrkdwn"
                    text: "*Chocolatey:*\n${{ steps.status.outputs.s_choco }}"
                  - type: "mrkdwn"
                    text: "*Homebrew:*\n${{ steps.status.outputs.s_brew }}"
                  - type: "mrkdwn"
                    text: "*Arch (AUR):*\n${{ steps.status.outputs.s_arch }}"
                  - type: "mrkdwn"
                    text: "*Container:*\n${{ steps.status.outputs.s_container }}"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Install:*\n```curl -sSL https://install.mondoo.com/sh | sh```"
