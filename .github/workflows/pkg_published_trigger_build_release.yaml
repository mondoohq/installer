name: "PKG: Package, Release, Reindex"

on:
  release:
    # `published`, not `[released, prereleased]`.
    #
    # `prereleased` fires when a pre-release is *created*, which is not when we
    # need it. v14.0.0-rc.3's release object was created hours before it was
    # published, so by publish time that activity had long passed and this
    # workflow never ran -- while test-released-all.yaml, which listens to
    # `published`, fired on the same release.
    #
    # The event type was never doing real work anyway: every job below gates on
    # `needs.parse-inputs.outputs.channel`, derived from the version itself.
    # Keying off the type as well was a second, less reliable copy of a decision
    # already made. See minstaller ADR 0003.
    types: [published]
  workflow_dispatch:
    inputs:
      skip-publish:
        description: "Do not publish the packages"
        type: boolean
        default: false
      version:
        description: "Package Version (e.g. v8.99.99)"
        required: true
        default: "v8.99.99"
        type: "string"
      bucket:
        description: "GCP Release Bucket Name"
        required: true
        default: "releases-us.mondoo.io"
        type: choice
        options:
          - "releases-us.mondoo.io"
          - "releases-com-test"
      reindex-path:
        description: "Path to Reindex (e.g. 8.99.99)"
        required: false
        type: string
      reindex-full:
        description: "Regenerate ALL indexes (Intensive!)"
        required: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  # C07QZDJFF89 == #release-coordination
  SLACK_BOT_CHANNEL_ID: "C07QZDJFF89"

jobs:
  notify:
    runs-on: ubuntu-latest
    outputs:
      update-ts: ${{ steps.slack.outputs.ts }}
    steps:
      - id: slack
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_BOT_CHANNEL_ID }}"
            text: "GitHub Actions Run"
            attachments:
              - color: "#FFFF00"
                blocks:
                  - type: "section"
                    fields:
                      - type: "mrkdwn"
                        text: "<${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}|${{ github.workflow }}>"
                      - type: "mrkdwn"
                        text: "*Status:*\n`In Progress`"

  parse-inputs:
    needs: [notify]
    uses: ./.github/workflows/parse_inputs.yml
    with:
      skip-publish: ${{ inputs.skip-publish }}
      version: ${{ (github.event_name == 'workflow_dispatch' && inputs.version) || github.event.release.tag_name }}
      bucket: ${{ inputs.bucket }}

  # Gates the packaging that reaches a shared, channel-less stream: apt, yum,
  # chocolatey, homebrew and AUR each have exactly one distribution, so a
  # release candidate published there is one an `apt upgrade` hands to every
  # machine that never opted into it.
  #
  # Not the MSI or the macOS pkg: those publish a versioned artifact into the
  # bucket and nothing else, so they build on every channel (see build-msi).
  # Nor the bucket publication in `reindex`.
  #
  # A pre-release skips these jobs rather than failing the run: the run is
  # expected and its other half has work to do.
  check-version:
    needs: [parse-inputs]
    if: ${{ needs.parse-inputs.outputs.channel == 'stable' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          VERSION: ${{ needs.parse-inputs.outputs.version }}
        run: |
          echo "Checking version: $VERSION"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "❌ Prerelease versions are not allowed ($VERSION)"
            exit 1
          fi
          echo "✅ Version $VERSION is allowed"

  # Channel-independent, unlike the other packaging jobs. This one only
  # `gsutil cp`s a versioned artifact into the bucket
  # (mondoo/<version>/mondoo_<version>_windows_<arch>.msi), so a pre-release is
  # invisible until someone asks for it by version or through the preview
  # channel. apt, yum, chocolatey, homebrew and AUR have a single stream with no
  # channel concept, which is why those stay behind check-version.
  #
  # Without this a preview user on Windows could only take the zip, not the
  # installer -- on the platform where the installer is how people install.
  build-msi:
    uses: ./.github/workflows/pkg_msi.yaml
    needs: [parse-inputs]
    secrets:
      TSIGN_AZURE_CLIENT_ID: ${{ secrets.TSIGN_AZURE_CLIENT_ID }}
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      INSTALL_TEST_MONDOO_REGISTRATION_TOKEN: ${{ secrets.INSTALL_TEST_MONDOO_REGISTRATION_TOKEN }}
    with:
      version: ${{ needs.parse-inputs.outputs.version }}
      skip-publish: ${{ needs.parse-inputs.outputs.skip-publish == 'true' }}
      bucket: ${{ needs.parse-inputs.outputs.bucket }}
  build-mondoo-pkgs:
    permissions:
      contents: write
    uses: ./.github/workflows/release_mondoo_pkgs.yaml
    needs: [check-version, parse-inputs]
    secrets:
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      GPG_KEY: ${{ secrets.GPG_KEY }}
      GPG_PUBKEY: ${{ secrets.GPG_PUBKEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      REPO_API_TOKEN: ${{ secrets.REPO_API_TOKEN }}
    with:
      version: ${{ needs.parse-inputs.outputs.version }}
      skip-publish: ${{ needs.parse-inputs.outputs.skip-publish == 'true' }}
      bucket: ${{ needs.parse-inputs.outputs.bucket }}
  # Channel-independent for the same reason as build-msi: it publishes only
  # mondoo/<version>/<name>_<version>_darwin_universal.pkg. Signed and notarized
  # either way -- an unsigned pre-release pkg would be worse than none, since
  # Gatekeeper would block it and the workaround teaches a bad habit.
  build-macos:
    uses: ./.github/workflows/pkg_macos.yaml
    needs: [parse-inputs]
    secrets:
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_KEYS_PRODUCTSIGN_P12: ${{ secrets.APPLE_KEYS_PRODUCTSIGN_P12 }}
      APPLE_KEYS_CODESIGN_P12: ${{ secrets.APPLE_KEYS_CODESIGN_P12 }}
      APPLE_KEYS_PASSWORD: ${{ secrets.APPLE_KEYS_PASSWORD }}
      APPLE_KEYS_CODESIGN_ID: ${{ secrets.APPLE_KEYS_CODESIGN_ID }}
      APPLE_KEYS_PRODUCTSIGN_ID: ${{ secrets.APPLE_KEYS_PRODUCTSIGN_ID }}
      APPLE_ACCOUNT_USERNAME: ${{ secrets.APPLE_ACCOUNT_USERNAME }}
      APPLE_ACCOUNT_PASSWORD: ${{ secrets.APPLE_ACCOUNT_PASSWORD }}
      APPLE_ACCOUNT_TEAM_ID: ${{ secrets.APPLE_ACCOUNT_TEAM_ID }}
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
    with:
      version: ${{ needs.parse-inputs.outputs.version }}
      skip-publish: ${{ needs.parse-inputs.outputs.skip-publish == 'true' }}
      bucket: ${{ needs.parse-inputs.outputs.bucket }}
  # Copies the cnspec and mql binaries into the release bucket and regenerates
  # the indexes, which is what puts a release on releases.mondoo.com and into
  # its channel's pointer document. Runs for every channel.
  #
  # Maintenance note: a GitHub Actions `if:` expression cannot call a composite
  # action or share a named expression, so each packaging job has to be listed
  # here by hand. Add a build-* job to `needs` below and it must be added to
  # this condition too, or a failure in it would no longer block publication.
  #
  # `!cancelled()` rather than `always()`: the packaging jobs it waits on are
  # skipped on a pre-release, and a skipped dependency would otherwise skip this
  # too — but `always()` would also publish to the bucket after someone cancels
  # the run, which is an outward-facing side effect nobody asked for. The
  # explicit result checks keep a *failed* packaging job from publishing.
  reindex:
    runs-on: ubuntu-latest
    needs:
      [check-version, parse-inputs, build-mondoo-pkgs, build-macos, build-msi]
    if: >-
      ${{
        !cancelled() &&
        needs.parse-inputs.result == 'success' &&
        !contains(fromJSON('["failure", "cancelled"]'), needs.check-version.result) &&
        !contains(fromJSON('["failure", "cancelled"]'), needs.build-mondoo-pkgs.result) &&
        !contains(fromJSON('["failure", "cancelled"]'), needs.build-macos.result) &&
        !contains(fromJSON('["failure", "cancelled"]'), needs.build-msi.result)
      }}
    steps:
      # fetch a token for the mondoo-mergebot app
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id accepts the same value as the old app-id input, see
          # https://github.com/actions/create-github-app-token/blob/v3.1.1/main.js#L21
          client-id: ${{ secrets.MONDOO_MERGEBOT_APP_ID }}
          private-key: ${{ secrets.MONDOO_MERGEBOT_APP_PRIVATE_KEY }}
          owner: mondoohq
          repositories: |
            installer
            releasr
            cnspec
            mql
      - name: Converge Inputs
        id: inputs
        env:
          BUCKET: ${{ needs.parse-inputs.outputs.bucket }}
          REINDEX_PATH: ${{ inputs.reindex-path }}
        run: |
          echo "bucket=${BUCKET}" >> $GITHUB_OUTPUT
          echo "reindex-path=${REINDEX_PATH}" >> $GITHUB_OUTPUT
      - name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093" # v3.0.0
        with:
          credentials_json: "${{secrets.GCP_CREDENTIALS}}"
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db" # v3.0.1
      - name: Get GCP TOKEN
        id: auth
        run: echo "id_token=$(gcloud auth print-identity-token)" >> "$GITHUB_OUTPUT"
      - name: Get latest Releasr Binary
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1
        with:
          repository: mondoohq/releasr
          latest: true
          fileName: releasr
          out-file-path: .
          token: ${{ steps.generate-token.outputs.token }}
      - name: Make releasr executable
        run: |
          chmod +x releasr
      - name: Release cnspec & mql binaries
        env:
          TOKEN: ${{ steps.auth.outputs.id_token }}
          BUCKETNAME: ${{ needs.parse-inputs.outputs.bucket }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          SKIP: ${{ (needs.parse-inputs.outputs.skip-publish == 'true') && 'echo skipping...' || '' }}
        run: |
          $SKIP ./releasr release cp  https://github.com/mondoohq/mql/releases/tag/v${{ needs.parse-inputs.outputs.version }} gs://${{ needs.parse-inputs.outputs.bucket }}
          $SKIP ./releasr release cp  https://github.com/mondoohq/cnspec/releases/tag/v${{ needs.parse-inputs.outputs.version }} gs://${{ needs.parse-inputs.outputs.bucket }}
      - name: "Remove Artifacts.json & Index.html from path (Optional)"
        env:
          SKIP: ${{ (needs.parse-inputs.outputs.skip-publish == 'true') && 'echo skipping...' || '' }}
        run: |
          if [ -n "${{ inputs.reindex-path }}" ]; then
            echo "Removing artifacts.json & index.html from path ${{ inputs.reindex-path }}"
            # If the files don't exist this will fail, but that's ok
            $SKIP gsutil rm gs://${{ needs.parse-inputs.outputs.bucket }}/${{ inputs.reindex-path }}/artifacts.json || true
            $SKIP gsutil rm gs://${{ needs.parse-inputs.outputs.bucket }}/${{ inputs.reindex-path }}/index.html || true
          fi
      - name: Regenerate Release Indexes
        env:
          TOKEN: ${{ steps.auth.outputs.id_token }}
          BUCKETNAME: ${{ needs.parse-inputs.outputs.bucket }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          IDX_OPTS: ${{ inputs.reindex-full && '--force-recompute' || '' }}
          SKIP: ${{ (needs.parse-inputs.outputs.skip-publish == 'true') && 'echo skipping...' || '' }}
        run: |
          $SKIP ./releasr idx gs://${{ needs.parse-inputs.outputs.bucket }} $IDX_OPTS
      - name: Restart minstaller Cloud Run Service
        env:
          MINSTALLER: ${{ (needs.parse-inputs.outputs.skip-publish == 'true') && 'minstaller-dev' || 'minstaller' }}
        run: |
          gcloud --project mondoo-base-infra \
              run services describe "$MINSTALLER" --region us-central1 --format export > "$MINSTALLER.yaml"
          gcloud --project mondoo-base-infra \
              run services replace "$MINSTALLER.yaml" --region us-central1
          rm "$MINSTALLER.yaml"
      - name: Invalidate Google Load Balancer caches (ETA~10 minutes)
        run: |
          gcloud compute url-maps invalidate-cdn-cache releases-mondoo-io --path "/${{ inputs.reindex-path || '*' }}"
  build-arch:
    # Packaging: stable only. See check-version.
    if: ${{ needs.parse-inputs.outputs.channel == 'stable' }}
    uses: ./.github/workflows/pkg_arch-aur.yaml
    needs: [parse-inputs, reindex]
    secrets:
      AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
      AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    with:
      version: ${{ needs.parse-inputs.outputs.version }}
      skip: ${{ needs.parse-inputs.outputs.skip-publish == 'true' }}
  build-chocolatey:
    # Packaging: stable only. See check-version.
    if: ${{ needs.parse-inputs.outputs.channel == 'stable' }}
    uses: ./.github/workflows/pkg_chocolatey.yaml
    needs: [parse-inputs, reindex]
    secrets:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    with:
      version: ${{ needs.parse-inputs.outputs.version }}
      skip-publish: ${{ needs.parse-inputs.outputs.skip-publish == 'true' }}
  build-container:
    # Packaging: stable only. See check-version.
    if: ${{ needs.parse-inputs.outputs.skip-publish != 'true' && needs.parse-inputs.outputs.channel == 'stable' }}
    needs: [parse-inputs, reindex]
    uses: ./.github/workflows/build_container.yml
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    with:
      version: ${{ needs.parse-inputs.outputs.version }}
      skip-publish: ${{ needs.parse-inputs.outputs.skip-publish == 'true' }}
  build-homebrew:
    # Packaging: stable only. See check-version.
    if: ${{ needs.parse-inputs.outputs.channel == 'stable' }}
    needs: [parse-inputs, reindex]
    uses: mondoohq/homebrew-mondoo/.github/workflows/release.yml@master
    # TODO(mondoohq/homebrew-mondoo#59): Replace secrets: inherit with explicit
    # secrets after adding secrets declarations to the homebrew-mondoo workflow_call
    # trigger. Required secrets: MONDOO_MERGEBOT_APP_ID, MONDOO_MERGEBOT_APP_PRIVATE_KEY
    secrets: inherit
    with:
      version: ${{ needs.parse-inputs.outputs.version }}
      skip-publish: ${{ needs.parse-inputs.outputs.skip-publish == 'true' }}

  update-notify:
    # always(), deliberately: this job's entire purpose is to close out the
    # Slack message with the run's outcome, so it has to run when that outcome
    # is failure or cancellation. Guarding it on its dependencies would leave a
    # broken run showing "In Progress" forever.
    if: ${{ always() }}
    # Every job whose result this message reports has to be in `needs`:
    # `needs.<job>` for a job that is not a dependency evaluates to empty,
    # so a missing entry renders as "Not run" rather than failing.
    needs:
      [
        notify,
        parse-inputs,
        reindex,
        build-msi,
        build-macos,
        build-mondoo-pkgs,
        build-arch,
        build-chocolatey,
        build-container,
        build-homebrew,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Set status
        id: status
        env:
          # A pre-release skips every packaging job, so requiring all four to be
          # 'success' would post red on every successful pre-release run. Green
          # means nothing failed; skipped is not failed.
          RESULTS: >-
            ${{ needs.reindex.result }}
            ${{ needs.build-chocolatey.result }}
            ${{ needs.build-container.result }}
            ${{ needs.build-homebrew.result }}
          VERSION: ${{ needs.parse-inputs.outputs.version }}
          CHANNEL: ${{ needs.parse-inputs.outputs.channel }}
          R_REINDEX: ${{ needs.reindex.result }}
          R_MSI: ${{ needs.build-msi.result }}
          R_MACOS: ${{ needs.build-macos.result }}
          R_PKGS: ${{ needs.build-mondoo-pkgs.result }}
          R_CHOCO: ${{ needs.build-chocolatey.result }}
          R_BREW: ${{ needs.build-homebrew.result }}
        run: |
          set -euo pipefail
          ok=true
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) ok=false ;;
            esac
          done
          echo "results: $RESULTS -> success=$ok"
          echo "status_success=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" = "true" ]; then
            echo "header=:rocket: ${VERSION} published" >> "$GITHUB_OUTPUT"
            echo "mention=" >> "$GITHUB_OUTPUT"
          else
            echo "header=:x: ${VERSION} failed to publish" >> "$GITHUB_OUTPUT"
            echo "mention=<!here> " >> "$GITHUB_OUTPUT"
          fi

          # The channel decides which half of this workflow runs, so it is the first
          # thing a reader needs in order to know whether a row of "Skipped" is
          # correct or alarming.
          if [ "$CHANNEL" = "stable" ]; then
            echo "channel_line=:package: *stable* — packaged for apt, yum, chocolatey, homebrew and AUR" >> "$GITHUB_OUTPUT"
          else
            echo "channel_line=:test_tube: *preview* — bucket and signed installers only; the OS repositories are deliberately untouched" >> "$GITHUB_OUTPUT"
          fi

          status() {
            case "$2" in
              success) echo "*$1:*\n:white_check_mark: Done" ;;
              skipped) echo "*$1:*\n:double_vertical_bar: Skipped" ;;
              "")      echo "*$1:*\n:grey_question: Not run" ;;
              *)       echo "*$1:*\n:x: $2" ;;
            esac
          }
          {
            echo "s_reindex=$(status 'Bucket + indexes' "$R_REINDEX")"
            echo "s_msi=$(status 'Windows MSI' "$R_MSI")"
            echo "s_macos=$(status 'macOS pkg' "$R_MACOS")"
            echo "s_pkgs=$(status 'apt / yum' "$R_PKGS")"
            echo "s_choco=$(status Chocolatey "$R_CHOCO")"
            echo "s_brew=$(status Homebrew "$R_BREW")"
          } >> "$GITHUB_OUTPUT"
      - uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        if: ${{ always() }}
        with:
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_BOT_CHANNEL_ID }}"
            ts: "${{ needs.notify.outputs.update-ts }}"
            text: "${{ steps.status.outputs.mention }}${{ steps.status.outputs.header }}"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "${{ steps.status.outputs.header }}"
                  emoji: true
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.status.outputs.channel_line }}"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Version:*\n`${{ needs.parse-inputs.outputs.version }}`"
                  - type: "mrkdwn"
                    text: "*Triggered by:*\n${{ github.actor }}"
                  - type: "mrkdwn"
                    text: "*Workflow run:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run>"
                  - type: "mrkdwn"
                    text: "*Release notes:*\n<https://github.com/${{ github.repository }}/releases/tag/v${{ needs.parse-inputs.outputs.version }}|v${{ needs.parse-inputs.outputs.version }}>"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "${{ steps.status.outputs.s_reindex }}"
                  - type: "mrkdwn"
                    text: "${{ steps.status.outputs.s_msi }}"
                  - type: "mrkdwn"
                    text: "${{ steps.status.outputs.s_macos }}"
                  - type: "mrkdwn"
                    text: "${{ steps.status.outputs.s_pkgs }}"
                  - type: "mrkdwn"
                    text: "${{ steps.status.outputs.s_choco }}"
                  - type: "mrkdwn"
                    text: "${{ steps.status.outputs.s_brew }}"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Install:*\n```curl -sSL https://install.mondoo.com/sh | sh```"
