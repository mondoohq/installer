name: 'PKG: macOS Universal pkg Release'

on:
  workflow_call:
    inputs:
      version:
        description: 'Package Version'
        required: true
        default: '8.99.99'
        type: 'string'
      name:
        description: 'Package Name'
        required: false
        default: 'mondoo'
        type: 'string'
      skip-publish:
        description: 'Skip publish?'
        required: false
        default: false
        type: boolean
      bucket:
        description: 'GCP Release Bucket Name'
        required: true
        default: 'releases-us.mondoo.io'
        type: string
    secrets:
      APPLE_KEYCHAIN_PASSWORD:
        required: true
      APPLE_KEYS_PRODUCTSIGN_P12:
        required: true
      APPLE_KEYS_CODESIGN_P12:
        required: true
      APPLE_KEYS_PASSWORD:
        required: true
      APPLE_KEYS_CODESIGN_ID:
        required: true
      APPLE_KEYS_PRODUCTSIGN_ID:
        required: true
      APPLE_ACCOUNT_USERNAME:
        required: true
      APPLE_ACCOUNT_PASSWORD:
        required: true
      APPLE_ACCOUNT_TEAM_ID:
        required: true
      GCP_CREDENTIALS:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Package Version'
        required: true
        default: '0.0.1'
        type: 'string'
      name:
        description: 'Package Name'
        required: false
        default: 'mondoo'
        type: 'string'
      skip-publish:
        description: 'Skip publish?'
        required: false
        default: false
        type: boolean
      bucket:
        description: 'GCP Release Bucket Name'
        required: true
        default: 'releases-us.mondoo.io'
        type: choice
        options:
          - 'releases-us.mondoo.io'
          - 'releases-com-test'

permissions: {}

jobs:
  pkg:
    permissions:
      contents: read
    name: 'Packaging: Mac'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure version of mql and cnspec are available
        env:
          VERSION: ${{ inputs.version }}
        run: |
          curl -sL --head --fail "https://github.com/mondoohq/mql/releases/download/v${VERSION}/mql_${VERSION}_darwin_amd64.tar.gz"
          curl -sL --head --fail "https://github.com/mondoohq/cnspec/releases/download/v${VERSION}/cnspec_${VERSION}_darwin_amd64.tar.gz"
      - name: Setup local keychain for signing certificates
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          PRODUCTSIGN_P12: ${{ secrets.APPLE_KEYS_PRODUCTSIGN_P12 }}
          CODESIGN_P12: ${{ secrets.APPLE_KEYS_CODESIGN_P12 }}
          KEYS_PASSWORD: ${{ secrets.APPLE_KEYS_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          # Setup Keychain:
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Import Certificates:
          echo "$PRODUCTSIGN_P12" | base64 --decode > "$RUNNER_TEMP/AppleKeysProductSign.p12"
          echo "$CODESIGN_P12"  | base64 --decode > "$RUNNER_TEMP/AppleKeysCodeSign.p12"
          security import "$RUNNER_TEMP/AppleKeysProductSign.p12" -P "$KEYS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/AppleKeysCodeSign.p12" -P "$KEYS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      ########## Build Package. ##########
      - name: Run Mac Packager
        env:
          APPLE_KEYS_CODESIGN_ID: ${{ secrets.APPLE_KEYS_CODESIGN_ID }}
          APPLE_KEYS_PRODUCTSIGN_ID: ${{ secrets.APPLE_KEYS_PRODUCTSIGN_ID }}
          PKGNAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          "${GITHUB_WORKSPACE}/packages/macos/build-pkg.sh" "${VERSION}"
      - name: Inspect Distribution
        if: ${{ always() }}
        run: ls -lhR
      ########## Sign Package. ##########
      - name: Package Sign Package (productsign)
        env:
          PKGNAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          PRODUCTSIGN_ID: ${{ secrets.APPLE_KEYS_PRODUCTSIGN_ID }}
        run: |
          productsign --sign "${PRODUCTSIGN_ID}" "dist/${PKGNAME}-macos-universal-${VERSION}.pkg" "dist/${PKGNAME}_${VERSION}_darwin_universal.pkg"
      ########## Notarize Package. ##########
      # The job passes only on an Accepted status, read from notarytool's
      # JSON output rather than inferred from its exit code. When notarytool
      # produced no JSON at all (bad credentials, network failure), the job
      # fails with its exit code; its own error is on stderr above. On any
      # other status Apple's log for the submission is printed.
      - name: Notarize Package
        env:
          PKGNAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ACCOUNT_USERNAME }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ACCOUNT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_ACCOUNT_TEAM_ID }}
        run: |
          PKG="dist/${PKGNAME}_${VERSION}_darwin_universal.pkg"
          RESULT="${RUNNER_TEMP}/notarytool-submit.json"
          xcrun notarytool submit "${PKG}" \
            --apple-id "${APPLE_ID}" --password "${APPLE_PASSWORD}" --team-id "${APPLE_TEAM_ID}" \
            --wait --timeout 30m --output-format json > "${RESULT}" && SUBMIT_EXIT=0 || SUBMIT_EXIT=$?
          cat "${RESULT}"
          if ! jq -e . "${RESULT}" > /dev/null 2>&1; then
            echo "::error::notarytool exited ${SUBMIT_EXIT} without a JSON result"
            exit 1
          fi
          STATUS=$(jq -r '.status // empty' "${RESULT}")
          ID=$(jq -r '.id // empty' "${RESULT}")
          if [ "${STATUS}" != "Accepted" ]; then
            echo "::error::Notarization status: ${STATUS:-none}"
            if [ -n "${ID}" ]; then
              xcrun notarytool log "${ID}" \
                --apple-id "${APPLE_ID}" --password "${APPLE_PASSWORD}" --team-id "${APPLE_TEAM_ID}"
            fi
            exit 1
          fi
      # Stapling attaches the notarization ticket to the pkg, so Gatekeeper
      # can verify it without reaching Apple, for example on an offline host.
      # spctl then assesses the pkg the way Gatekeeper does on install.
      - name: Staple Package
        env:
          PKGNAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          PKG="dist/${PKGNAME}_${VERSION}_darwin_universal.pkg"
          xcrun stapler staple "${PKG}"
          xcrun stapler validate "${PKG}"
          spctl --assess --type install -vv "${PKG}"
      ########## Save Package as Artifact. ##########
      - name: Archive Notarized Package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notarized-package
          path: dist/${{ inputs.name }}_${{ inputs.version }}_darwin_universal.pkg
          retention-days: 30

  publish:
    permissions:
      contents: read
    name: 'Publish: Releases'
    needs: pkg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Notarized Package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notarized-package
          path: dist
      - name: Get Version & Checksum
        env:
          PKGNAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          cd dist
          # Ensure we only have a single file
          FILES=`ls *.pkg | wc -l`
          if [[ $FILES != 1 ]]; then
            echo "We have more than one file in the dist folder. This is not expected."
            exit 1
          fi
          sha256sum "${PKGNAME}_${VERSION}_darwin_universal.pkg" | tee -a checksums.macos.txt
      - name: Authenticate with Google Cloud
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
        with:
          credentials_json: '${{secrets.GCP_CREDENTIALS}}'
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db' # v3.0.1
      - name: Verify access to release bucket
        env:
          BUCKET: ${{ inputs.bucket }}
        run: |
          gsutil ls "gs://${BUCKET}/mondoo"
      - name: Upload static content to buckets
        env:
          BUCKET: ${{ inputs.bucket }}
          PKGNAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
          SKIP: ${{ inputs.skip-publish && 'echo skipping...' || '' }}
        run: |
          cd dist
          $SKIP gsutil cp checksums.macos.txt "gs://${BUCKET}/mondoo/${VERSION}/checksums.macos.txt"
          $SKIP gsutil cp "${PKGNAME}_${VERSION}_darwin_universal.pkg" "gs://${BUCKET}/mondoo/${VERSION}/${PKGNAME}_${VERSION}_darwin_universal.pkg"
