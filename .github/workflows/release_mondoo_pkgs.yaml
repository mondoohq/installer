name: "Build & Release mondoo Meta-Package"

on:
  workflow_call:
    inputs:
      version:
        description: "Version that should be released"
        required: true
        default: "8.99.99"
        type: "string"
      skip-publish:
        description: "Skip publish?"
        required: false
        default: false
        type: boolean
      bucket:
        description: "GCP Release Bucket Name"
        required: true
        default: "releases-us.mondoo.io"
        type: string
    secrets:
      GCP_CREDENTIALS:
        required: true
      GPG_KEY:
        required: true
      GPG_PUBKEY:
        required: true
      GPG_PASSPHRASE:
        required: true
      REPO_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version that should be released"
        required: true
        default: "1.2.3"
        type: "string"
      skip-publish:
        description: "Skip publish?"
        required: false
        default: false
        type: boolean
      bucket:
        description: "GCP Release Bucket Name"
        required: true
        default: "releases-us.mondoo.io"
        type: choice
        options:
          - "releases-us.mondoo.io"
          - "releases-com-test"

permissions: {}

jobs:
  build-mondoo-payloads:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create destination folder
        run: |
          cd  helper
          mkdir packages

      - name: Install RPM tools
        run: |
          sudo apt update && sudo apt install -y rpm gpg

      - name: Authenticate with GCloud
        uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093" # v3.0.0
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Setup GCloud SDK
        uses: "google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db" # v3.0.1

      - name: "Import Signing Keys"
        run: |
          gpgkey="$(mktemp -t gpgkey.XXX)"
          gpgpubkey="$(mktemp -t gpgpubkey.XXX)"
          base64 -d <<<"$GPG_KEY" > "$gpgkey"
          base64 -d <<<"$GPG_PUBKEY" > "$gpgpubkey"
          gpg --batch --import --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback "$gpgkey" "$gpgpubkey"
          rm "$gpgkey" "$gpgpubkey"
        env:
          GPG_KEY: "${{ secrets.GPG_KEY}}"
          GPG_PUBKEY: "${{ secrets.GPG_PUBKEY}}"
          GPG_PASSPHRASE: "${{ secrets.GPG_PASSPHRASE}}"

      - name: Check GPG Keys
        run: |
          gpg --list-keys
          gpg --list-secret-keys

      - name: Build Packages
        run: |
          cd helper && make

      - name: Sign RPMs
        run: |
          cd helper/
          rpmsign \
              --define='%_gpg_name Mondoo Inc' \
              --define='%__gpg_sign_cmd %{__gpg} gpg --batch --no-armor --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" %{?_gpg_digest_algo:--digest-algo %{_gpg_digest_algo}} --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} %{__plaintext_filename}' \
              --addsign ./packages/*rpm

      - name: Generate Checksums
        run: |
          cd helper/packages
          sha256sum *linux* > checksums.linux.txt

      - name: Upload files to releases.mondoo.com
        env:
          BUCKET: ${{ inputs.bucket }}
          VERSION: ${{ inputs.version }}
          SKIP: ${{ inputs.skip-publish && 'echo skipping...' || '' }}
        run: |
          $SKIP gsutil cp -r helper/packages/* "gs://${BUCKET}/mondoo/${VERSION}/"

      - name: Upload files to GitHub Release Page
        if: ${{ !inputs.skip-publish }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ inputs.version }}
          files: helper/packages/*

      - name: Create Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mondoo-${{ inputs.version }}
          path: helper/packages/
          retention-days: 7

  # Stable only, unlike the job above it.
  #
  # Building a package and publishing it to the apt and yum repositories are two
  # different acts with two different audiences. The build puts a versioned
  # artifact in the bucket, where nothing reaches it unless someone asks for that
  # version or that channel. This tells repobuilder to fold the version into
  # repositories that have exactly one stream and no notion of a channel, so a
  # release candidate that lands there is one `apt upgrade` hands to every
  # machine that never asked for it.
  #
  # The channel is derived from the version rather than passed in, because a
  # caller that has to declare it is a caller that can declare it wrongly, and
  # the whole release pipeline derives channels from semver for that reason.
  # Deriving it here also means a manual workflow_dispatch of a release candidate
  # skips the repositories without anyone having to remember to say so.
  update-downstream:
    runs-on: ubuntu-latest
    needs: build-mondoo-payloads
    ## Matrix task, repeats steps for each repo
    strategy:
      matrix:
        repo: ["mondoohq/repobuilder"]
    steps:
      - name: Derive the channel from the version
        id: channel
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # SemVer 9: a pre-release is the segment after `-`. Build metadata is
          # stripped first, because a `-` after `+` is metadata (SemVer 10), so
          # 8.4.0+41-build is stable while 14.0.0-rc.7 is not.
          core="${VERSION%%+*}"
          if [ "${core}" != "${core#*-}" ]; then
            echo "::notice::${VERSION} is a pre-release; not publishing to the apt/yum repositories"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Repository Dispatch (Release)
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        if: ${{ !inputs.skip-publish && steps.channel.outputs.stable == 'true' }}
        with:
          token: ${{ secrets.REPO_API_TOKEN }}
          repository: ${{ matrix.repo }}
          event-type: update
          client-payload: '{"version": "${{ inputs.version }}"}'
