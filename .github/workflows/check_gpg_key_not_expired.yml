name: "Check Mondoo's GPG key is not expired"
on:
  workflow_dispatch:
  # Run every day at 00:00
  schedule:
    - cron:  '0 0 * * *'

permissions: {}

jobs:
  check_gpg:
    permissions:
      contents: read
    name: Check Mondoo's GPG key has not expired
    env:
      # C07R9GSGKEU == #mondoo-ops
      SLACK_BOT_CHANNEL_ID: "C07R9GSGKEU"

    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: slack
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_BOT_CHANNEL_ID }}"
            text: "GitHub Actions Run"
            attachments:
              - color: "#FFFF00"
                blocks:
                  - type: "section"
                    fields:
                      - type: "mrkdwn"
                        text: "<${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}|${{ github.workflow }}>"
                      - type: "mrkdwn"
                        text: "*Status:*\n`In Progress`"
          
      - name: Install Mondoo cnspec
        shell: bash
        run: |
          echo Installing Mondoo cnspec...
          bash -xc "$(curl -sSL https://install.mondoo.com/sh/cnspec)"

      - name: Write the public signing key
        shell: bash
        run: |
          if [[ -z "$GPG_PUBKEY" ]]; then
            echo "::error::GPG_PUBKEY secret is not set"
            exit 1
          fi
          base64 -d <<<"$GPG_PUBKEY" > public-package-signing.gpg
        env:
          GPG_PUBKEY: "${{ secrets.GPG_PUBKEY }}"

      - name: Check expiration of the public package signing key
        shell: bash
        run: |
          cnspec scan local --detect-cicd --risk-threshold 100 --policy-bundle test/cnspec/check-gpg.mql.yaml -o full

      - name: Report the key expiration date
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expires=$(cnspec run local -j -c '
            parse.openpgp(content: file("public-package-signing.gpg").content).list {
              primaryPublicKey.id
              expiresOn = primaryPublicKey.creationTime + identities[0].signatures[0].keyLifetimeSecs * time.second
              expiresOn
            }' | jq -er '.[0]["parse.openpgp.list"][0] | "Key \(.["primaryPublicKey.id"]) expires on \(.expiresOn)"')
          echo "$expires"
          echo "$expires" >> "$GITHUB_STEP_SUMMARY"

      - name: Install OpenPGP & cURL
        run: sudo apt install gpg -y

      - name: Check Public GPG Signing Key Harmony
        shell: bash
        run: |
          bash test/scripts/cert-harmony.sh public-package-signing.gpg

      - uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        if: always()
        with:
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_BOT_CHANNEL_ID }}"
            ts: "${{ steps.slack.outputs.ts }}"
            text: "GitHub Actions Run"
            attachments:
              - color: "${{ job.status == 'success' && '#00FF00' || job.status == 'failure' && '#FF0000' || '#FFA500' }}"
                blocks:
                  - type: "section"
                    fields:
                      - type: "mrkdwn"
                        text: "<${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}|${{ github.workflow }}>"
                      - type: "mrkdwn"
                        text: "*Status:*\n`${{ job.status }}`"
