name: Create installer GitHub Release

on:
  repository_dispatch:
    types: [trigger-release]
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: "The version to release"
      skip-publish:
        type: boolean
        description: "Publish as a pre-release (do not promote to Latest)"
        default: false
      dry-run:
        type: boolean
        description: "Skip softprops release + slack (test skip-publish/make_latest wiring only)"
        default: false

permissions: {}

env:
  # C07QZDJFF89 == #release-coordination
  SLACK_BOT_CHANNEL_ID: "C07QZDJFF89"

jobs:
  # Resolve skip-publish and dry-run to canonical "true"/"false" strings.
  # Doing this in a bash step avoids the fragile `||` truthiness rules
  # that mix workflow_dispatch's boolean inputs with repository_dispatch's
  # JSON client payload values: any of true / True / TRUE / 1 -> true,
  # anything else (including empty and the string "false") -> false.
  # dry-run is resolved from client_payload too so it can be threaded
  # through by callers, not just workflow_dispatch.
  resolve-inputs:
    runs-on: ubuntu-latest
    outputs:
      skip-publish: ${{ steps.resolve.outputs.skip-publish }}
      dry-run: ${{ steps.resolve.outputs.dry-run }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          WF_SKIP_PUBLISH: ${{ inputs.skip-publish }}
          CP_SKIP_PUBLISH: ${{ github.event.client_payload.skip-publish }}
          WF_DRY_RUN: ${{ inputs.dry-run }}
          CP_DRY_RUN: ${{ github.event.client_payload.dry-run }}
        run: |
          normalize() {
            case "$1" in
              [Tt][Rr][Uu][Ee]|1) echo true ;;
              *)                  echo false ;;
            esac
          }
          case "$EVENT_NAME" in
            workflow_dispatch)
              SKIP_RAW="$WF_SKIP_PUBLISH"
              DRY_RAW="$WF_DRY_RUN"
              ;;
            repository_dispatch)
              SKIP_RAW="$CP_SKIP_PUBLISH"
              DRY_RAW="$CP_DRY_RUN"
              ;;
            *)
              SKIP_RAW=""
              DRY_RAW=""
              ;;
          esac
          SKIP_OUT=$(normalize "$SKIP_RAW")
          DRY_OUT=$(normalize "$DRY_RAW")
          echo "event=$EVENT_NAME skip-publish($SKIP_RAW)=$SKIP_OUT dry-run($DRY_RAW)=$DRY_OUT"
          echo "skip-publish=$SKIP_OUT" >> "$GITHUB_OUTPUT"
          echo "dry-run=$DRY_OUT" >> "$GITHUB_OUTPUT"

  parse-inputs:
    needs: resolve-inputs
    uses: ./.github/workflows/parse_inputs.yml
    with:
      version: ${{ (github.event_name == 'workflow_dispatch' && inputs.version) || github.event.client_payload.version }}
      skip-publish: ${{ needs.resolve-inputs.outputs.skip-publish }}

  create-gh-release:
    name: GH Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [parse-inputs, resolve-inputs]
    steps:
      - name: Check calling user
        if: ${{ github.event_name == 'repository_dispatch' && github.event.sender.login != 'mondoo-mergebot[bot]' }}
        run: |
          echo "This user is not allowed to trigger the workflow"
          exit 1
      # Print the resolved release parameters so workflow_dispatch with
      # dry-run=true can verify the make_latest / prerelease / skip-publish
      # wiring end to end without creating a GitHub release. Values pass
      # through env: rather than being interpolated straight into the
      # script, so a hostile release input can't inject shell.
      - name: Print resolved release parameters
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ needs.parse-inputs.outputs.version }}
          CHANNEL: ${{ needs.parse-inputs.outputs.channel }}
          SKIP_PUBLISH: ${{ needs.parse-inputs.outputs.skip-publish }}
          DRY_RUN: ${{ needs.resolve-inputs.outputs.dry-run }}
        run: |
          # Must mirror the release step below exactly, or dry-run reports
          # something the real run would not do.
          if [ "$CHANNEL" != "stable" ] || [ "$SKIP_PUBLISH" = "true" ]; then
            MAKE_LATEST=false
            PRERELEASE=true
          else
            MAKE_LATEST=legacy
            PRERELEASE=false
          fi
          echo "event:                 $EVENT_NAME"
          echo "parse-inputs version:  $VERSION"
          echo "parse-inputs channel:  $CHANNEL"
          echo "parse-inputs skip:     $SKIP_PUBLISH"
          echo "computed tag_name:     v$VERSION"
          echo "computed make_latest:  $MAKE_LATEST"
          echo "computed prerelease:   $PRERELEASE"
          echo "dry-run:               $DRY_RUN"
      # Laid out like cnspec's release message, which this one follows in the
      # channel: a header, the channel line, then the fields. Version and
      # channel come from parse-inputs, which validated them, so both are safe
      # inside the double-quoted YAML scalars and Slack mrkdwn below.
      - name: Compose Slack message
        id: meta
        if: ${{ needs.resolve-inputs.outputs.dry-run != 'true' }}
        env:
          CHANNEL: ${{ needs.parse-inputs.outputs.channel }}
          SKIP_PUBLISH: ${{ needs.parse-inputs.outputs.skip-publish }}
        run: |
          if [ "$CHANNEL" != "stable" ]; then
            echo "channel_line=:test_tube: *preview* — published as a pre-release, not promoted to latest" >> "$GITHUB_OUTPUT"
          elif [ "$SKIP_PUBLISH" = "true" ]; then
            echo "channel_line=:double_vertical_bar: *stable, skip-publish* — published as a pre-release, not promoted to latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel_line=:package: *stable* — published and promoted to latest" >> "$GITHUB_OUTPUT"
          fi
      - id: slack
        if: ${{ needs.resolve-inputs.outputs.dry-run != 'true' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_BOT_CHANNEL_ID }}"
            text: ":hourglass_flowing_sand: installer v${{ needs.parse-inputs.outputs.version }} GitHub release in progress"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: ":hourglass_flowing_sand: installer v${{ needs.parse-inputs.outputs.version }} GitHub release in progress"
                  emoji: true
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.meta.outputs.channel_line }}"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Repository:*\n`${{ github.repository }}`"
                  - type: "mrkdwn"
                    text: "*Version:*\n`v${{ needs.parse-inputs.outputs.version }}`"
                  - type: "mrkdwn"
                    text: "*Triggered by:*\n${{ github.actor }}"
                  - type: "mrkdwn"
                    text: "*Workflow run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}|Open run>"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # fetch a token for the mondoo-mergebot app
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id accepts the same value as the old app-id input, see
          # https://github.com/actions/create-github-app-token/blob/v3.1.1/main.js#L21
          client-id: ${{ secrets.MONDOO_MERGEBOT_APP_ID }}
          private-key: ${{ secrets.MONDOO_MERGEBOT_APP_PRIVATE_KEY }}
      - name: Release
        id: release
        if: ${{ needs.resolve-inputs.outputs.dry-run != 'true' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.parse-inputs.outputs.version }}
          generate_release_notes: true
          # A pre-release is published but not promoted, and GitHub fires
          # `prereleased` rather than `released` when prerelease is true --
          # which is what lets the packaging pipeline stay stable-only while
          # bucket publication runs for both.
          #
          # The channel is derived from the version's own semver pre-release
          # segment, which closes the regression #752 documented: a
          # 14.0.0-rc.1 dispatched with skip-publish=false was published as a
          # normal release, because auto-detection from the tag is disabled
          # once make_latest/prerelease are set explicitly.
          #
          # skip-publish still forces a pre-release, so the manual override
          # from #752 keeps working; it can no longer be the only thing
          # standing between a release candidate and Latest.
          make_latest: ${{ (needs.parse-inputs.outputs.channel == 'stable' && needs.parse-inputs.outputs.skip-publish != 'true') && 'legacy' || 'false' }}
          prerelease: ${{ needs.parse-inputs.outputs.channel != 'stable' || needs.parse-inputs.outputs.skip-publish == 'true' }}
          token: ${{ steps.generate-token.outputs.token }}
      - name: Set status
        id: status
        if: ${{ always() && needs.resolve-inputs.outputs.dry-run != 'true' }}
        env:
          VERSION: ${{ needs.parse-inputs.outputs.version }}
          OUTCOME: ${{ steps.release.outcome }}
        run: |
          # `skipped` means a step before the release failed, so the release did
          # not happen: that is a failure to report, not a quiet non-event.
          {
            if [ "$OUTCOME" = "success" ]; then
              echo "header=:rocket: installer v${VERSION} GitHub release created"
              echo "mention="
              echo "release_status=:white_check_mark: Done"
            else
              echo "header=:x: installer v${VERSION} GitHub release failed"
              echo "mention=<!here> "
              echo "release_status=:x: ${OUTCOME:-not run}"
            fi
          } >> "$GITHUB_OUTPUT"
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        # Without a ts there is no message to update; chat.update would only
        # add a second failure to the one that stopped the post.
        if: ${{ always() && needs.resolve-inputs.outputs.dry-run != 'true' && steps.slack.outputs.ts != '' }}
        with:
          method: chat.update
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_BOT_CHANNEL_ID }}"
            ts: "${{ steps.slack.outputs.ts }}"
            text: "${{ steps.status.outputs.mention }}${{ steps.status.outputs.header }}"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "${{ steps.status.outputs.header }}"
                  emoji: true
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.meta.outputs.channel_line }}"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Repository:*\n`${{ github.repository }}`"
                  - type: "mrkdwn"
                    text: "*Version:*\n`v${{ needs.parse-inputs.outputs.version }}`"
                  - type: "mrkdwn"
                    text: "*Triggered by:*\n${{ github.actor }}"
                  - type: "mrkdwn"
                    text: "*Workflow run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}|Open run>"
                  - type: "mrkdwn"
                    text: "*GitHub release:*\n${{ steps.status.outputs.release_status }}"
                  - type: "mrkdwn"
                    text: "*Release notes:*\n<${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.parse-inputs.outputs.version }}|v${{ needs.parse-inputs.outputs.version }}>"
