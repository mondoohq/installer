name: "Lint: PowerShell file encoding"

# Runs on pull requests, which is the point: the previous version of this
# workflow was workflow_dispatch only and had never run once, so it could not
# have caught anything.
on:
  pull_request:
    paths:
      - "**.ps1"
      - "**.psm1"
      - "**.psd1"
      - ".github/scripts/check-powershell-encoding.sh"
      - ".github/workflows/check_powershell_file_encoding.yml"
  push:
    branches: [main]
    paths:
      - "**.ps1"
      - "**.psm1"
      - "**.psd1"
      - ".github/scripts/check-powershell-encoding.sh"
      - ".github/workflows/check_powershell_file_encoding.yml"
  workflow_dispatch:

permissions: {}

jobs:
  encoding:
    name: UTF-8 BOM and CRLF
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check PowerShell file encoding
        run: ./.github/scripts/check-powershell-encoding.sh
