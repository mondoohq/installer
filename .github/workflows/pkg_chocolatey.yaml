name: "PKG: Chocolatey NuGet Release"

on:
  workflow_call:
    inputs:
      version:
        description: "Version to release"
        required: true
        type: string
        default: "8.0.0"
      skip-publish:
        description: "Skip publish?"
        required: false
        default: false
        type: boolean
    secrets:
      CHOCOLATEY_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        type: string
        default: "8.0.0"
      skip-publish:
        description: "Skip publish?"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  chocotize:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [mql, cnspec, cnquery]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate and Validate Package
        env:
          VERSION: ${{ inputs.version }}
          PACKAGES: ${{ matrix.package }}
        run: make -C packages/chocolatey generate validate VERSION="${VERSION}" PACKAGES="${PACKAGES}"

      - name: Pack Package
        env:
          VERSION: ${{ inputs.version }}
          PACKAGES: ${{ matrix.package }}
        run: make -C packages/chocolatey pack VERSION="${VERSION}" PACKAGES="${PACKAGES}"

      - name: Publish Package
        if: ${{ ! inputs.skip-publish }}
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          VERSION: ${{ inputs.version }}
          PACKAGES: ${{ matrix.package }}
        run: make -C packages/chocolatey publish VERSION="${VERSION}" PACKAGES="${PACKAGES}"

