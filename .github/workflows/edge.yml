name: Release Mondoo Edge Container Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Mondoo client version'
        required: true

permissions: {}

jobs:
  build_container:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Build Docker
    steps:
      - name: Clean Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          echo "VERSION=${INPUT_VERSION}" >> $GITHUB_ENV
          echo "version=${INPUT_VERSION}" >> $GITHUB_OUTPUT

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          image: tonistiigi/binfmt@sha256:d3b963f787999e6c0219a48dba02978769286ff61a5f4d26245cb6a6e5567ea3 # latest
          platforms: arm64,arm

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push root images (alpine)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/386,linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
          push: true
          build-args: |
            BASEURL=https://releases.mondoo.com/edge/mondoo/${{ steps.version.outputs.version }}
            VERSION=${{ steps.version.outputs.version }}
          target: root
          tags: |
            mondoo/client:edge-${{ steps.version.outputs.version }}
            mondoo/client:edge-latest

      - name: Build and push rootless images (alpine)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/386,linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
          push: true
          build-args: |
            BASEURL=https://releases.mondoo.com/edge/mondoo/${{ steps.version.outputs.version }}
            VERSION=${{ steps.version.outputs.version }}
          target: rootless
          tags: |
            mondoo/client:edge-${{ steps.version.outputs.version }}-rootless
            mondoo/client:edge-latest-rootless
