---
name: Script Linting

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  # Whether this pull request touches the MSI sources at all. A job cannot
  # carry a `paths` filter the way a workflow trigger can, so the question is
  # answered once here and the WiX job keys off it.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      msi: ${{ steps.filter.outputs.msi }}
    steps:
      # No checkout. The question is "which files does this pull request
      # touch", which GitHub already knows, so asking it avoids cloning the
      # repository to compute a diff.
      #
      # A `git diff BASE...HEAD` needs a merge base, so it needs real history
      # on both sides -- a shallow clone of each cannot produce one. That
      # leaves a full clone as the only working git answer, which is a lot of
      # work to decide whether to start a second job.
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # This workflow is pull_request-only today, so PR is always set. If a
          # push trigger is ever added, run the lint rather than skip it: the
          # cost of being wrong here is a Windows runner, and the cost of being
          # wrong the other way is an MSI error reaching main unnoticed, which
          # is what this check exists to prevent.
          if [ -z "${PR:-}" ]; then
            echo "msi=true" >> "$GITHUB_OUTPUT"
            echo "No pull request number in this event; linting rather than assuming nothing changed."
            exit 0
          fi

          # --paginate: the unpaged call returns the first 30 files only, and a
          # large pull request would look as though it changed nothing here.
          if gh api --paginate "/repos/${REPO}/pulls/${PR}/files" --jq '.[].filename' \
             | grep -qE '^(packages/msi/|\.github/workflows/lint_wix\.yaml)'; then
            echo "msi=true" >> "$GITHUB_OUTPUT"
            echo "MSI sources changed; the WiX lint will run."
          else
            echo "msi=false" >> "$GITHUB_OUTPUT"
            echo "No MSI sources changed; the WiX lint is skipped."
          fi

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          ignore_paths: examples
          severity: warning
          scandir: '.'

  powershell:
    permissions:
      contents: read
      security-events: write
    name: PowerShell Analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run PSScriptAnalyzer
        uses: microsoft/psscriptanalyzer-action@6b2948b1944407914a58661c49941824d149734f # v1.1
        with:
          path: .\*.ps1
          output: 'results.sarif'
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif

  # Last, and only once the cheap lints are green. candle and light need a
  # Windows runner, and the errors they catch (unresolved references, the ICE
  # suite) are invisible to every other check here -- two of them reached main
  # before this existed.
  wix:
    name: WiX MSI sources
    needs: [changes, shellcheck, powershell]
    if: needs.changes.outputs.msi == 'true'
    uses: ./.github/workflows/lint_wix.yaml
