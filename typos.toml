# Configuration for crate-ci/typos (see .github/workflows/spell-check.yaml)
# Docs: https://github.com/crate-ci/typos

[files]
extend-exclude = [
  # Third-party licence text. Not ours to correct, and the RTF/HTML markup
  # splits words across control sequences so most hits are not words at all.
  "packages/msi/msi/license.rtf",
  "packages/archlinux/mondoo/LICENSE.html",
  # Binary assets
  "*.png",
  "*.jpg",
  "*.ico",
  "*.bmp",
]

[default]
# Blocks of base64 that are not text. Ignoring each block wholesale means
# regenerating one cannot introduce a new "typo" -- which is what listing each
# fragment as a word left us doing, one re-sign at a time.
extend-ignore-re = [
  # Authenticode signature blocks appended to the signed PowerShell scripts.
  "(?s)# SIG # Begin signature block.*?# SIG # End signature block",
  # The PGP public keys published in the README for verifying packages.
  "(?s)-----BEGIN PGP PUBLIC KEY BLOCK-----.*?-----END PGP PUBLIC KEY BLOCK-----",
]

# Terms typos misflags. Each maps the word to itself so typos treats it as
# correct. Matching is case-insensitive.
[default.extend-words]
# PowerShell operators read as words: -ine is case-insensitive not-equal.
ine = "ine"
# Product and tool names
aks = "aks"             # Azure Kubernetes Service
hashi = "hashi"         # HashiCorp
copywrite = "copywrite" # HashiCorp copywrite tool, used by the license check
# Real misspellings that cannot be corrected here.
#
# TODO(#785): appears in install.ps1 and Mondoo.Installer.psm1, both of which
# carry an Authenticode signature in the repository. Editing the text
# invalidates that signature, and signing is a manual workflow_dispatch
# (sign_powershell.yml), so a fix has to be paired with a re-sign rather than
# ridden along with an unrelated change. Remove this entry with that fix.
registred = "registred"
